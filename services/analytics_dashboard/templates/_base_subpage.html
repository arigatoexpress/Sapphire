<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>{% block title %}Sapphire OS{% endblock %} :: sapphirealpha.xyz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath d='M32 6 56 24 32 58 8 24Z' fill='none' stroke='%2300ff66' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050606;
  --bg-1: #0a0c0a;
  --bg-2: #0e1110;
  --line: #1a2a1d;
  --line-bright: #2d4a35;
  --green: #00ff66;
  --green-dim: #00b04a;
  --green-glow: rgba(0,255,102,0.15);
  --green-shadow: rgba(0,255,102,0.35);
  --amber: #ffb300;
  --red: #ff3344;
  --text: #d8f0d8;
  --text-dim: #6c8a6e;
  --text-mute: #4a5e4d;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13px;
  line-height: 1.55;
  font-feature-settings: "zero";
  -webkit-font-smoothing: antialiased;
}
{% block extra_root_css %}{% endblock %}

/* CRT scanline overlay (subtle, optional) */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,255,102,0.025) 0px,
    rgba(0,255,102,0.025) 1px,
    transparent 1px,
    transparent 3px
  );
  z-index: 9999;
  mix-blend-mode: screen;
}

a { color: var(--green); text-decoration: none; }
a:hover { color: var(--green); text-shadow: 0 0 8px var(--green-glow); }

.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 28px 80px;
  min-height: 100vh;
}

header.top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
  gap: 16px; flex-wrap: wrap;
}
.crumb {
  display: flex; align-items: center; gap: 12px;
  font-size: 12px; color: var(--text-dim);
}
.crumb a.back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--line-bright);
  border-radius: 0;
  color: var(--green);
  font-weight: 500;
  letter-spacing: 0.02em;
}
.crumb a.back:hover { background: var(--green-glow); }
.crumb .sep { color: var(--text-mute); }
.crumb .here { color: var(--text); font-weight: 500; }
.head-meta {
  font-size: 11px; color: var(--text-mute);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.head-meta .blink {
  display: inline-block; width: 8px; height: 8px;
  background: var(--green); border-radius: 50%;
  animation: blink 1.6s infinite;
  vertical-align: middle; margin-right: 6px;
  box-shadow: 0 0 8px var(--green-shadow);
}
@keyframes blink { 0%, 60% { opacity: 1; } 70%, 100% { opacity: 0.25; } }

/* ASCII frame box */
.box {
  border: 1px solid var(--line-bright);
  background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
  padding: 18px 20px;
  margin-bottom: 18px;
  position: relative;
}
.box::before {
  content: "+ - - - - - - -";
  position: absolute; top: -10px; left: 12px;
  background: var(--bg);
  padding: 0 8px;
  font-size: 10px; color: var(--line-bright);
  letter-spacing: 0.4em;
}

h1.section, h2.section {
  margin: 0 0 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--green);
  letter-spacing: 0.02em;
  text-shadow: 0 0 8px var(--green-glow);
}
h1.section::before, h2.section::before {
  content: "> ";
  color: var(--green-dim);
}
.hero {
  padding: 28px 4px 18px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.hero h1 {
  margin: 0 0 8px;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--green);
  text-shadow: 0 0 12px var(--green-glow);
}
.hero .typed {
  font-size: 13px;
  color: var(--text-dim);
  margin: 6px 0 0;
}
.hero .typed::after {
  content: "_";
  display: inline-block;
  margin-left: 2px;
  animation: blink 1s steps(1) infinite;
  color: var(--green);
}

.kv { display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; font-size: 12px; }
.kv .k { color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
.kv .v { color: var(--text); }

.pill {
  display: inline-block;
  padding: 2px 8px;
  border: 1px solid var(--line-bright);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-radius: 0;
}
.pill.green { color: var(--green); border-color: var(--green-dim); background: var(--green-glow); }
.pill.amber { color: var(--amber); border-color: #6f5500; background: rgba(255,179,0,0.12); }
.pill.red { color: var(--red); border-color: #6c1f25; background: rgba(255,51,68,0.12); }

.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) {
  .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
}

.card {
  border: 1px solid var(--line-bright);
  padding: 14px 16px;
  background: var(--bg-1);
  position: relative;
  transition: border-color 120ms;
}
.card:hover { border-color: var(--green-dim); }
.card h3 { margin: 0 0 6px; font-size: 13px; color: var(--green); font-weight: 500; }
.card .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; font-size: 12px; }
.card .row .lbl { color: var(--text-mute); }
.card .row .val { color: var(--text); }

.btn {
  display: inline-block;
  padding: 8px 16px;
  border: 1px solid var(--green);
  color: var(--green);
  background: transparent;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}
.btn:hover { background: var(--green-glow); text-shadow: 0 0 8px var(--green-glow); }
.btn.lg { padding: 14px 28px; font-size: 13px; }

table.term {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
table.term th, table.term td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
}
table.term th {
  color: var(--text-mute); font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px;
}
table.term tr:hover td { background: var(--green-glow); }

.muted { color: var(--text-mute); font-size: 11px; }
.dim { color: var(--text-dim); }
code, pre {
  font-family: inherit;
  background: var(--bg-2);
  padding: 1px 6px;
  border: 1px solid var(--line);
  color: var(--text);
}
pre { padding: 12px 14px; overflow-x: auto; }

footer.term-footer {
  margin-top: 36px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--text-mute);
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
{% block extra_css %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="crumb">
      <a class="back" href="/">[ &lt; back ]</a>
      <span class="sep">/</span>
      <span class="dim">sapphirealpha.xyz</span>
      <span class="sep">/</span>
      <span class="here">{% block crumb %}p{% endblock %}</span>
    </div>
    <div class="head-meta"><span class="blink"></span>{% block meta %}live{% endblock %}</div>
  </header>

  {% block content %}{% endblock %}

  <footer class="term-footer">
    <div>sapphire-os :: public-safe route</div>
    <div>built for cypherpunks &middot; <a href="/p/help">[help]</a> &middot; <a href="/p/about">[about]</a></div>
  </footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
