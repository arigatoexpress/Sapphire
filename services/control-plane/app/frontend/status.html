<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sapphire OS — System Status</title>
<meta http-equiv="refresh" content="120">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'SF Mono', 'Fira Code', monospace; background: #0a0a0f; color: #e0e0e0; padding: 20px; }
  h1 { color: #00aaff; font-size: 24px; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 12px; margin-bottom: 20px; }
  .overall { font-size: 18px; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
  .overall.GREEN { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid #22c55e; }
  .overall.YELLOW { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid #f59e0b; }
  .overall.RED { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid #ef4444; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
  .section { background: #111118; border: 1px solid #222; border-radius: 10px; padding: 16px; }
  .section h2 { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
  .item:last-child { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .dot.yellow { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
  .dot.red { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
  .name { flex: 1; color: #ccc; }
  .detail { color: #666; font-size: 11px; max-width: 200px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .schedule { margin-top: 20px; }
  .schedule h2 { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  .task { background: #111118; border: 1px solid #1a1a1a; border-radius: 6px; padding: 8px 12px; font-size: 12px; }
  .task .time { color: #00aaff; font-weight: bold; }
  .task .desc { color: #888; }
  .loading { color: #666; font-style: italic; }
  .stats { display: flex; gap: 20px; margin: 12px 0; flex-wrap: wrap; }
  .stat { background: #111118; border: 1px solid #222; border-radius: 8px; padding: 12px 16px; text-align: center; min-width: 100px; }
  .stat .num { font-size: 28px; font-weight: bold; color: #00aaff; }
  .stat .label { font-size: 11px; color: #666; margin-top: 2px; }
</style>
</head>
<body>
<h1>🔷 Sapphire OS — System Status</h1>
<div class="subtitle" id="timestamp">Loading...</div>

<div id="overall" class="overall" style="display:none"></div>

<div class="stats" id="stats"></div>

<div class="grid" id="grid">
  <div class="section"><p class="loading">Loading health data...</p></div>
</div>

<div class="schedule" id="schedule-section" style="display:none">
  <h2>Scheduled Tasks (19 autonomous agents)</h2>
  <div class="task-grid" id="tasks"></div>
</div>

<script>
async function loadHealth() {
  try {
    // Fetch from health_check.py via a local API proxy
    // Since we can't run Python from the browser, we'll fetch the control-plane's own health
    // and supplement with what we know about the ecosystem

    const healthResp = await fetch('/health');
    const health = await healthResp.json();

    // Fetch ecosystem data from control-plane APIs
    const [eventsResp, tasksResp] = await Promise.all([
      fetch('/api/events?limit=10').catch(() => null),
      fetch('/api/tasks?limit=20').catch(() => null),
    ]);

    const events = eventsResp ? await eventsResp.json().catch(() => ({})) : {};
    const tasks = tasksResp ? await tasksResp.json().catch(() => ({})) : {};

    // Fetch LIVE ecosystem health from the API
    const ecoResp = await fetch('/api/ecosystem-health').catch(() => null);
    const eco = ecoResp ? await ecoResp.json().catch(() => null) : null;

    // Convert API response to display arrays
    function toItems(section) {
      if (!section) return [];
      return Object.entries(section).map(([name, info]) => ({
        name: name.replace(/-/g, ' ').replace(/_/g, ' '),
        status: info.status || 'green',
        detail: (info.detail || '').substring(0, 80),
      }));
    }

    const services = eco ? toItems(eco.services) : [{ name: 'Loading...', status: 'yellow', detail: '' }];
    const repos = eco ? toItems(eco.repos) : [];
    const data_pipes = eco ? toItems(eco.data_freshness) : [];
    const inference = eco ? toItems(eco.inference) : [];

    // Render
    const overallStatus = eco ? eco.overall : 'YELLOW';
    const summary = eco ? eco.summary : 'Loading...';

    document.getElementById('timestamp').textContent =
      'Updated: ' + new Date().toLocaleString() + ' • Auto-refresh: 2 min • Live from /api/ecosystem-health';

    const overall = document.getElementById('overall');
    overall.className = 'overall ' + overallStatus;
    const icon = overallStatus === 'GREEN' ? '✅' : overallStatus === 'YELLOW' ? '⚠️' : '🔴';
    overall.textContent = `${icon} ${overallStatus} — ${summary}`;
    overall.style.display = 'block';

    // Count statuses
    const allItems = [...services, ...repos, ...data_pipes, ...inference];
    const greenCount = allItems.filter(i => i.status === 'green').length;
    const yellowCount = allItems.filter(i => i.status === 'yellow').length;
    const redCount = allItems.filter(i => i.status === 'red').length;

    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="num">${greenCount}</div><div class="label">Green</div></div>
      <div class="stat"><div class="num">${yellowCount}</div><div class="label">Yellow</div></div>
      <div class="stat"><div class="num">${redCount}</div><div class="label">Red</div></div>
      <div class="stat"><div class="num">11</div><div class="label">Plugin Tools</div></div>
      <div class="stat"><div class="num">19</div><div class="label">Scheduled Tasks</div></div>
      <div class="stat"><div class="num">1,211</div><div class="label">Tests</div></div>
    `;

    function renderSection(title, items) {
      return `<div class="section"><h2>${title}</h2>` +
        items.map(i => `<div class="item"><span class="dot ${i.status || 'green'}"></span><span class="name">${i.name}</span><span class="detail">${i.detail}</span></div>`).join('') +
        '</div>';
    }

    document.getElementById('grid').innerHTML =
      renderSection('Services', services) +
      renderSection('Repositories', repos) +
      renderSection('Data Pipelines', data_pipes) +
      renderSection('Inference', inference);

    // Scheduled tasks
    const scheduledTasks = [
      { time: '2:00 AM', desc: 'Creative Experimenter — nightly R&D lab' },
      { time: '3:41 AM', desc: 'Test Guardian — full suite sweep' },
      { time: '5:42 AM', desc: 'Trading Research — predictions + scoring' },
      { time: '6:27 AM', desc: 'Threat Intel Sweep — CISA/NVD/MITRE' },
      { time: '7:19 AM', desc: 'GitHub Discovery — stars + trending' },
      { time: '8:03 AM', desc: 'Morning Briefing — 6-section digest' },
      { time: '8:37 AM', desc: 'Market Pulse — pre-market scan (M-F)' },
      { time: '10:11 AM', desc: 'Client Delivery — THO + Regional Intel' },
      { time: '11:07 AM', desc: 'THO Test Writer — coverage growth' },
      { time: '12:37 PM', desc: 'Market Pulse — midday scan (M-F)' },
      { time: '1:03 PM', desc: 'Code Quality Sweep — lint + cleanup' },
      { time: '2:27 PM', desc: 'Threat Intel Sweep — afternoon update' },
      { time: '3:41 PM', desc: 'Test Guardian — afternoon run' },
      { time: '4:37 PM', desc: 'Market Pulse — close scan (M-F)' },
      { time: '5:53 PM', desc: 'Evening Digest — daily summary' },
      { time: '8:53 PM', desc: 'Self-Improvement — priorities + quality' },
      { time: '11:07 PM', desc: 'THO Test Writer — evening session' },
    ];

    const continuous = [
      { time: '*/2h', desc: 'THO Production Health Check' },
      { time: '*/3h', desc: 'CI Monitor — all repos' },
      { time: '*/4h', desc: 'Vote Monitor Collector' },
      { time: '*/6h', desc: 'Factory Repo Fixer' },
    ];

    document.getElementById('schedule-section').style.display = 'block';
    document.getElementById('tasks').innerHTML =
      [...scheduledTasks, ...continuous].map(t =>
        `<div class="task"><span class="time">${t.time}</span> <span class="desc">${t.desc}</span></div>`
      ).join('');

  } catch (err) {
    document.getElementById('grid').innerHTML =
      `<div class="section"><p style="color:#ef4444">Error loading health data: ${err.message}</p></div>`;
  }
}

loadHealth();
</script>
</body>
</html>
