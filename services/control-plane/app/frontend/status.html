<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sapphire OS — System Status</title>
<meta http-equiv="refresh" content="120">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'SF Mono', 'Fira Code', monospace; background: #0a0a0f; color: #e0e0e0; padding: 20px; }
  h1 { color: #00aaff; font-size: 24px; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 12px; margin-bottom: 20px; }
  .overall { font-size: 18px; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
  .overall.GREEN { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid #22c55e; }
  .overall.YELLOW { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid #f59e0b; }
  .overall.RED { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid #ef4444; }
  .overall.LOADING { background: rgba(100,100,100,0.1); color: #888; border: 1px solid #444; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
  .section { background: #111118; border: 1px solid #222; border-radius: 10px; padding: 16px; }
  .section h2 { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
  .item:last-child { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .dot.yellow { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
  .dot.red { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
  .dot.grey { background: #555; }
  .name { flex: 1; color: #ccc; }
  .detail { color: #666; font-size: 11px; max-width: 220px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .schedule { margin-top: 20px; }
  .schedule h2 { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  .task { background: #111118; border: 1px solid #1a1a1a; border-radius: 6px; padding: 8px 12px; font-size: 12px; }
  .task .time { color: #00aaff; font-weight: bold; }
  .task .desc { color: #888; }
  .stats { display: flex; gap: 16px; margin: 12px 0; flex-wrap: wrap; }
  .stat { background: #111118; border: 1px solid #222; border-radius: 8px; padding: 10px 14px; text-align: center; min-width: 80px; }
  .stat .num { font-size: 24px; font-weight: bold; color: #00aaff; }
  .stat .label { font-size: 10px; color: #666; margin-top: 2px; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .loading-pulse { animation: pulse 1.5s infinite; }
</style>
</head>
<body>
<h1>🔷 Sapphire OS — System Status</h1>
<div class="subtitle">Updated: <span id="ts">loading</span></div>

<div id="overall" class="overall LOADING loading-pulse">⏳ Checking 20 health endpoints...</div>

<div class="stats">
  <div class="stat"><div class="num">11</div><div class="label">Plugin Tools</div></div>
  <div class="stat"><div class="num">19</div><div class="label">Tasks</div></div>
  <div class="stat"><div class="num">1,211+</div><div class="label">Tests</div></div>
  <div class="stat"><div class="num">8</div><div class="label">Repos</div></div>
  <div class="stat" id="stat-green"><div class="num">—</div><div class="label">Green</div></div>
  <div class="stat" id="stat-red"><div class="num">—</div><div class="label">Red</div></div>
</div>

<div class="grid" id="grid"></div>

<div class="schedule">
  <h2>Autonomous Schedule (19 tasks, 24/7)</h2>
  <div class="task-grid" id="tasks"></div>
</div>

<script>
// Render static content IMMEDIATELY (no API call needed)
const tasks = [
  { time: '2:00 AM', desc: 'Creative Experimenter — nightly R&D' },
  { time: '3:41 AM', desc: 'Test Guardian — full suite (1,211+ tests)' },
  { time: '5:42 AM', desc: 'Trading Research — predict + score' },
  { time: '6:27 AM', desc: 'Threat Intel — CISA/NVD/MITRE' },
  { time: '7:19 AM', desc: 'GitHub Discovery — stars + trending' },
  { time: '8:03 AM', desc: 'Morning Briefing — 6-section digest' },
  { time: '8:37 AM', desc: 'Market Pulse — pre-market (M-F)' },
  { time: '10:11 AM', desc: 'Client Delivery — THO production' },
  { time: '11:07 AM', desc: 'THO Test Writer — coverage growth' },
  { time: '12:37 PM', desc: 'Market Pulse — midday (M-F)' },
  { time: '1:03 PM', desc: 'Code Quality — lint + cleanup' },
  { time: '2:27 PM', desc: 'Threat Intel — afternoon update' },
  { time: '3:41 PM', desc: 'Test Guardian — afternoon run' },
  { time: '4:37 PM', desc: 'Market Pulse — close (M-F)' },
  { time: '5:53 PM', desc: 'Evening Digest — daily summary' },
  { time: '8:53 PM', desc: 'Self-Improvement — priorities' },
  { time: '11:07 PM', desc: 'THO Test Writer — evening' },
  { time: '*/2h', desc: 'THO Production Health Check' },
  { time: '*/3h', desc: 'CI Monitor — all repos' },
  { time: '*/4h', desc: 'Vote Monitor Collector' },
  { time: '*/6h', desc: 'Factory Repo Fixer' },
];

document.getElementById('tasks').innerHTML = tasks.map(t =>
  `<div class="task"><span class="time">${t.time}</span> <span class="desc">${t.desc}</span></div>`
).join('');

document.getElementById('ts').textContent = new Date().toLocaleString();

// Show placeholder grid while health loads
function renderSection(title, items) {
  return `<div class="section"><h2>${title}</h2>` +
    items.map(i => `<div class="item"><span class="dot ${i.s || 'grey'}"></span><span class="name">${i.n}</span><span class="detail">${i.d || ''}</span></div>`).join('') +
    '</div>';
}

document.getElementById('grid').innerHTML =
  renderSection('Services', [
    {n:'Control Plane',s:'green',d:'This page'},{n:'Dashboard',d:'checking...'},{n:'Signal Logger',d:'checking...'},
    {n:'OpenBB API',d:'checking...'},{n:'Redis',d:'checking...'},{n:'Regional Intel',d:'checking...'},{n:'THO Cloud Run',d:'checking...'},
  ]) +
  renderSection('Repositories', [
    {n:'Sapphire',d:'checking...'},{n:'Project-Go-Forward',d:'checking...'},{n:'cyber-threat-bot',d:'checking...'},
    {n:'regional-intel-workbench',d:'checking...'},{n:'Cointracker',d:'checking...'},{n:'claw-code',d:'checking...'},
  ]) +
  renderSection('Data Pipelines', [
    {n:'Trading Signals',d:'checking...'},{n:'Predictions',d:'checking...'},{n:'Threat Intel',d:'checking...'},
    {n:'Starred Repos',d:'checking...'},{n:'Market Pulse',d:'checking...'},
  ]) +
  renderSection('Inference', [
    {n:'Mac Ollama',d:'checking...'},{n:'Windows GPU Ollama',d:'checking...'},
  ]);

// THEN fetch live health data in the background
fetch('/api/ecosystem-health')
  .then(r => r.json())
  .then(eco => {
    function toItems(section) {
      return Object.entries(section || {}).map(([name, info]) => ({
        n: name.replace(/-/g, ' ').replace(/_/g, ' '),
        s: info.status || 'green',
        d: (info.detail || '').substring(0, 80),
      }));
    }

    document.getElementById('grid').innerHTML =
      renderSection('Services', toItems(eco.services)) +
      renderSection('Repositories', toItems(eco.repos)) +
      renderSection('Data Pipelines', toItems(eco.data_freshness)) +
      renderSection('Inference', toItems(eco.inference));

    const el = document.getElementById('overall');
    el.classList.remove('LOADING', 'loading-pulse');
    el.className = 'overall ' + eco.overall;
    const icon = eco.overall === 'GREEN' ? '✅' : eco.overall === 'YELLOW' ? '⚠️' : '🔴';
    el.textContent = `${icon} ${eco.overall} — ${eco.summary}`;

    const all = [...toItems(eco.services), ...toItems(eco.repos), ...toItems(eco.data_freshness), ...toItems(eco.inference)];
    document.getElementById('stat-green').querySelector('.num').textContent = all.filter(i => i.s === 'green').length;
    document.getElementById('stat-red').querySelector('.num').textContent = all.filter(i => i.s !== 'green').length;

    document.getElementById('ts').textContent = new Date().toLocaleString() + ' • Live';
  })
  .catch(err => {
    const el = document.getElementById('overall');
    el.classList.remove('loading-pulse');
    el.className = 'overall RED';
    el.textContent = '🔴 Health check failed: ' + err.message;
  });
</script>
</body>
</html>
