steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sapphire-alpha-dashboard:latest'
      - '.'
  # Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sapphire-alpha-dashboard:latest'
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sapphire-alpha-dashboard'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sapphire-alpha-dashboard:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--update-env-vars'
      - 'GCP_PROJECT=sapphire-479610,ENABLE_AUTH=false,PUBLIC_READ_ONLY=true,ENABLE_INTERNAL_JOBS=false,MAC_OPERATOR_APP_URL=sapphirebook://operator,MAC_OPERATOR_APP_LABEL=Open macOS Operator App'

images:
  - 'gcr.io/$PROJECT_ID/sapphire-alpha-dashboard:latest'

options:
  logging: CLOUD_LOGGING_ONLY
