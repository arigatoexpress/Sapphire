{% extends "base.html" %}

{% block content %}
<!-- Log Filters -->
<div class="card" style="margin-bottom: var(--space-xl);">
    <div class="card-body">
        <div style="display: flex; gap: var(--space-md); flex-wrap: wrap; align-items: center;">
            <div style="flex: 1; min-width: 200px;">
                <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: var(--space-xs);">Search</label>
                <input type="text" id="log-search" placeholder="Search logs..." style="width: 100%; padding: var(--space-sm); background: var(--bg-glass); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: inherit;">
            </div>
            <div>
                <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: var(--space-xs);">Service</label>
                <select id="service-filter" style="padding: var(--space-sm); background: var(--bg-glass); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: inherit;">
                    <option value="">All Services</option>
                    <option value="trading">Trading</option>
                    <option value="gateway">Gateway</option>
                    <option value="webhook">Webhook</option>
                    <option value="telegram">Telegram</option>
                </select>
            </div>
            <div>
                <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: var(--space-xs);">Level</label>
                <select id="level-filter" style="padding: var(--space-sm); background: var(--bg-glass); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: inherit;">
                    <option value="">All Levels</option>
                    <option value="error">Error</option>
                    <option value="warning">Warning</option>
                    <option value="info">Info</option>
                    <option value="debug">Debug</option>
                </select>
            </div>
            <div>
                <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: var(--space-xs);">Time Range</label>
                <select id="time-filter" style="padding: var(--space-sm); background: var(--bg-glass); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: inherit;">
                    <option value="1">Last 1 hour</option>
                    <option value="24" selected>Last 24 hours</option>
                    <option value="168">Last 7 days</option>
                </select>
            </div>
            <div style="display: flex; gap: var(--space-sm); margin-top: 18px;">
                <button class="btn btn-primary" onclick="applyFilters()">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle"><polygon points="22,3 2,3 10,12.46 10,19 14,21 14,12.46"/></svg> Apply
                </button>
                <button class="btn btn-secondary" onclick="resetFilters()">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle"><polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg> Reset
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Log Viewer Embed -->
<div class="card" style="margin-bottom: var(--space-xl);">
    <div class="card-header">
        <h3 class="card-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px; color: var(--primary); vertical-align: middle;"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Live Log Stream</h3>
        <div style="display: flex; gap: var(--space-sm);">
            <button class="btn btn-secondary" style="font-size: 0.8rem;" onclick="refreshLogs()">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle"><polyline points="23,4 23,10 17,10"/><polyline points="1,20 1,14 7,14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg> Refresh
            </button>
            <a href="https://sapphire-log-viewer-267358751314.us-central1.run.app" target="_blank" class="btn btn-secondary" style="font-size: 0.8rem;">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Full Log Viewer
            </a>
        </div>
    </div>
    <div class="card-body" style="padding: 0; height: 500px;">
        <iframe
            src="https://sapphire-log-viewer-267358751314.us-central1.run.app"
            style="width: 100%; height: 100%; border: none; border-radius: 0 0 12px 12px;"
            title="Log Viewer"
        ></iframe>
    </div>
</div>

<!-- Log Statistics -->
<div class="grid grid-4">
    <div class="stat-card">
        <div class="stat-label">Total Logs (24h)</div>
        <div class="stat-value" id="total-logs">--</div>
        <div class="stat-change">All services</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Errors</div>
        <div class="stat-value" id="error-count" style="color: var(--danger);">--</div>
        <div class="stat-change">Require attention</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Warnings</div>
        <div class="stat-value" id="warning-count" style="color: var(--warning);">--</div>
        <div class="stat-change">Review suggested</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Info</div>
        <div class="stat-value" id="info-count" style="color: var(--info);">--</div>
        <div class="stat-change">Normal operations</div>
    </div>
</div>

<!-- Recent Log Entries -->
<div class="card" style="margin-top: var(--space-xl);">
    <div class="card-header">
        <h3 class="card-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px; color: var(--secondary); vertical-align: middle;"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>Recent Log Entries</h3>
    </div>
    <div class="card-body">
        <div id="log-entries">
            <div class="loading">
                <div class="spinner"></div>
                Loading logs...
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function fetchLogs() {
        const hours = document.getElementById('time-filter').value;
        const service = document.getElementById('service-filter').value;
        const level = document.getElementById('level-filter').value;

        try {
            const params = new URLSearchParams();
            params.append('hours', hours);
            if (service) params.append('service', service);
            if (level) params.append('level', level);

            const response = await fetch(`/api/logs?${params.toString()}`, { credentials: 'same-origin' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            document.getElementById('total-logs').textContent = data.count || 0;

            const container = document.getElementById('log-entries');
            if (!data.logs || data.logs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>No logs found</p>
                        <p style="font-size: 0.85rem; margin-top: var(--space-sm);">Try adjusting your filters</p>
                    </div>
                `;
                return;
            }

            // Count by level
            const counts = { error: 0, warning: 0, info: 0 };
            data.logs.forEach(log => {
                const l = (log.level || 'info').toLowerCase();
                if (counts[l] !== undefined) counts[l]++;
            });

            document.getElementById('error-count').textContent = counts.error;
            document.getElementById('warning-count').textContent = counts.warning;
            document.getElementById('info-count').textContent = counts.info;

            // Render logs
            container.innerHTML = `
                <div style="font-family: var(--font-mono); font-size: 0.85rem;">
                    ${data.logs.slice(0, 50).map(log => {
                        const level = (log.level || 'info').toLowerCase();
                        const levelColor = {
                            error: 'var(--danger)',
                            warning: 'var(--warning)',
                            info: 'var(--info)',
                            debug: 'var(--text-muted)'
                        }[level] || 'var(--text)';

                        const time = new Date(log.timestamp).toLocaleTimeString();
                        return `
                            <div style="padding: var(--space-sm); border-bottom: 1px solid var(--border); display: flex; gap: var(--space-md);">
                                <span style="color: var(--text-muted); min-width: 80px;">${time}</span>
                                <span style="color: ${levelColor}; min-width: 60px; font-weight: 600;">${log.level || 'INFO'}</span>
                                <span style="color: var(--text-muted); min-width: 100px;">${log.service || 'system'}</span>
                                <span style="flex: 1; color: var(--text);">${log.message}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        } catch (e) {
            console.error('Failed to fetch logs:', e);
        }
    }

    function applyFilters() {
        fetchLogs();
    }

    function resetFilters() {
        document.getElementById('log-search').value = '';
        document.getElementById('service-filter').value = '';
        document.getElementById('level-filter').value = '';
        document.getElementById('time-filter').value = '24';
        fetchLogs();
    }

    function refreshLogs() {
        fetchLogs();
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchLogs();
    });
</script>
{% endblock %}
