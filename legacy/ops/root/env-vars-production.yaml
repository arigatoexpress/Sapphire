# Sapphire V2 Production Environment Variables for Cloud Run
# Use with: gcloud run services update sapphire-v2 --env-vars-file env-vars-production.yaml

# ============================================================================
# Platform Configuration
# ============================================================================
ENABLE_JUPITER: "true"
ENABLE_ASTER: "false"
ENABLE_ASTER: "true"
ENABLE_LIGHTER: "true"
ENABLE_LIGHTER: "true"
ENABLE_ASTER: "true"

# ============================================================================
# Solana / Jupiter Configuration
# ============================================================================
SOLANA_RPC_URL: "https://api.mainnet-beta.solana.com"

# ============================================================================
# Environment & Logging
# ============================================================================
ENVIRONMENT: "production"
LOG_LEVEL: "INFO"

# ============================================================================
# Trading Configuration
# ============================================================================
MAX_POSITIONS: "25"
MAX_SLIPPAGE_BPS: "50"
RISK_THRESHOLD: "0.3"
MAX_POSITION_PCT: "0.02"

# ============================================================================
# Telegram Configuration
# ============================================================================
ENABLE_TELEGRAM: "true"

# ============================================================================
# Database Configuration
# ============================================================================
DATABASE_ENABLED: "true"

# ============================================================================
# Agent Configuration
# ============================================================================
AGENT_PARALLEL_EXECUTION: "true"
ENABLE_PROFIT_MAXIMIZATION: "true"

# ============================================================================
# Lighter Configuration
# ============================================================================
LIGHTER_ACCOUNT_INDEX: "699444"
LIGHTER_API_KEY_INDEX: "0"
LIGHTER_INIT_TIMEOUT_SECONDS: "30"
LIGHTER_CHECK_CLIENT_TIMEOUT_SECONDS: "15"

# ============================================================================
# Aster Code (Builder Incentive)
# ============================================================================
ASTER_CODE_BUILDER_ADDRESS: "0xAf72Ae447aD3dcdcDfBAA01bB9c7b3C37a031aAf"
ASTER_CODE_FEE_RATE: "0"

# Note: Secrets (API keys, private keys) are loaded from GCP Secret Manager automatically
# Do not add sensitive values here!
