# Gitleaks config — extends the default ruleset and allowlists the
# red-team adversarial corpus where fake-but-realistic token shapes
# are a deliberate test input, not a leaked secret.

[extend]
useDefault = true

[allowlist]
description = "Red-team corpus + onboarding prose — adversarial token shapes are test fixtures, not real leaks"
paths = [
    '''tests/fixtures/redteam/.*\.json''',
    '''tests/unit/test_redteam_corpus\.py''',
    '''docs/onboarding/ai-redteam-.*\.md''',
    '''\.claude/skills/signal/SKILL\.md''',
    '''docs/cloud-audit-2026-04-15\.md''',
    '''infra/ON_PREM_MIGRATION\.md''',
    '''plugins/claw-sapphire/lib/sensitivity_classifier\.py''',
    '''scripts/archived/register_lighter_key\.py''',
    '''tests/legacy/test_security_fuzz\.py''',
    '''tests/unit/test_molthub_outreach\.py''',
    '''tests/unit/test_sensitivity_filter\.py''',
    '''tests/unit/test_ws_dashboard\.py''',
]
