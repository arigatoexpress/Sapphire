name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hosted macOS runners use /Users/runner for the tool cache, but Ari's
  # self-hosted Sapphire runner runs as /Users/aribs. Keep setup-python in a
  # writable local cache so no hosted minutes are needed.
  AGENT_TOOLSDIRECTORY: /Users/aribs/.github-runners/toolcache
  RUNNER_TOOL_CACHE: /Users/aribs/.github-runners/toolcache

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: lint (ruff)
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: ruff check
        run: uv run --python 3.11 --no-project --with ruff==0.7.4 ruff check --output-format=github .
      # Note: `ruff format --check` would currently flag 373 pre-existing
      # files. The PostToolUse hook + pre-commit keep new code formatted;
      # a repo-wide bulk format pass is a separate follow-up commit.

  test:
    name: test (pytest)
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    needs: lint
    env:
      AUTH_PASSWORD: ci-placeholder
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: pytest (unit + coverage)
        # PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 is set at the job level to avoid
        # loading stray plugins. pytest-asyncio must then be loaded explicitly
        # via -p, otherwise pytest 9.x fails async tests (8.x silently skipped
        # them, which hid the gap until the pytest bump in #78).
        run: |
          uv run --python 3.11 --no-project --with-requirements requirements-test.txt pytest tests/unit/ \
            --tb=short -q \
            --maxfail=25 \
            --durations=20 \
            -p no:cacheprovider \
            -p pytest_asyncio.plugin \
            -p pytest_cov.plugin \
            --cov=lib --cov=services --cov=plugins \
            --cov-report=xml \
            --cov-fail-under=60
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  plugin-test:
    name: plugin tests
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: pytest (claw-sapphire)
        run: uv run --python 3.11 --no-project --with-requirements requirements-test.txt pytest plugins/claw-sapphire/tests/ -q

  test-inventory:
    name: test inventory
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: README test inventory
        run: |
          uv run --python 3.11 --no-project --with-requirements requirements-test.txt \
            python scripts/ops/test_inventory.py --check-readme --max-drift 50

  public-boundary-smoke:
    name: public boundary smoke
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: scan public routes for admin data leaks
        run: |
          uv run --python 3.11 --no-project --with-requirements requirements-test.txt \
            python scripts/ops/public_boundary_smoke.py

  tool-registry:
    name: tool registry invariants
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: uv run --python 3.11 --no-project --with pyyaml python scripts/validate_tool_registry.py

  pine-lint:
    name: pine static analyzer
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: detect pine-relevant changes
        id: changed
        run: |
          # On PR builds compare against the base branch; on push builds
          # compare against the previous commit. Falls back to "always run"
          # for workflow_dispatch.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$head" -- \
              'pine/**' \
              'lib/trading/pine_templates.py' \
              'services/webhook/src/receiver.py' \
              | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: run lint_pine.py on standalone Pine
        if: steps.changed.outputs.run == 'true'
        run: |
          uv run --python 3.11 --no-project python scripts/lint_pine.py pine/standalone/*.pine

  smoke-test:
    name: container smoke test
    if: github.ref == 'refs/heads/main' && vars.SAPPHIRE_RUNNER != ''
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Verify analytics deploy source
        run: python3 scripts/ops/verify_analytics_deploy_source.py --source-dir services/analytics_dashboard
      - name: Build analytics dashboard image
        run: |
          docker build \
            -t sapphire-analytics-smoke \
            -f services/analytics_dashboard/Dockerfile \
            services/analytics_dashboard
      - name: Start container and health-check
        run: |
          docker run -d --name analytics-smoke \
            -p 8080:8080 \
            -e AUTH_PASSWORD=smoke-test \
            sapphire-analytics-smoke
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "✓ Container healthy"
              exit 0
            fi
            sleep 1
          done
          echo "✗ Health check timed out" >&2
          docker logs analytics-smoke
          exit 1
      - name: Stop container
        if: always()
        run: |
          docker stop analytics-smoke 2>/dev/null || true
          docker rm analytics-smoke 2>/dev/null || true

  deploy:
    name: deploy dashboard candidate
    # Deploy only when the self-hosted runner and Google WIF variables are
    # configured. Otherwise the auth action fails before it can no-op.
    if: github.ref == 'refs/heads/main' && vars.SAPPHIRE_RUNNER != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    needs: [test, smoke-test]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Verify analytics deploy source
        run: python3 scripts/ops/verify_analytics_deploy_source.py --source-dir services/analytics_dashboard
      - name: Deploy to Cloud Run
        run: |
          tag="ci-${GITHUB_SHA::7}"
          gcloud run deploy sapphire-dashboard \
            --source services/analytics_dashboard \
            --project sapphire-479610 \
            --region us-central1 \
            --platform managed \
            --no-traffic \
            --tag "$tag" \
            --quiet
          gcloud run services describe sapphire-dashboard \
            --project sapphire-479610 \
            --region us-central1 \
            --format="value(status.traffic[?tag='$tag'].url)"

  secrets-scan:
    name: gitleaks (secrets)
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install gitleaks when missing
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            brew install gitleaks
          fi
      - name: gitleaks current tree
        run: |
          gitleaks detect \
            --redact \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif
