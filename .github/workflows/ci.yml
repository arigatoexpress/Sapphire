name: Sapphire Focused CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  focused-gate:
    name: Focused Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          python -m pip install --upgrade pip
          python -m pip install pytest aiohttp loguru

      - name: Run focused CI gate
        run: ./scripts/ci_focused_gate.sh

  holistic-cloud-check:
    name: Holistic Cloud Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: focused-gate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect GCP auth availability
        id: gcp-auth
        run: |
          if [[ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" && -n "${{ secrets.GCP_SERVICE_ACCOUNT }}" && -n "${{ secrets.OPENCLAW_HOOK_AUDIENCE }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: ${{ steps.gcp-auth.outputs.enabled == 'true' }}
        id: gcp-oidc
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ secrets.OPENCLAW_HOOK_AUDIENCE }}

      - name: Set up Cloud SDK
        if: ${{ steps.gcp-auth.outputs.enabled == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Install runtime utilities
        if: ${{ steps.gcp-auth.outputs.enabled == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl ripgrep

      - name: Run holistic ops check
        if: ${{ steps.gcp-auth.outputs.enabled == 'true' }}
        env:
          SAPPHIRE_GATEWAY_OIDC_TOKEN: ${{ steps.gcp-oidc.outputs.id_token }}
        run: ./scripts/holistic_ops_check.sh

      - name: Skip cloud check when GCP secrets are unavailable
        if: ${{ steps.gcp-auth.outputs.enabled != 'true' }}
        run: echo "Skipping holistic cloud check because GCP auth secrets are not configured."
