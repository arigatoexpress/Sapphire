name: OpenClaw Hook Forwarder

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:

jobs:
  forward-to-openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Detect hook forwarding auth availability
        id: hook-auth
        env:
          HOOK_URL: ${{ secrets.OPENCLAW_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.OPENCLAW_HOOKS_TOKEN }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${HOOK_URL}" ]] || missing+=("OPENCLAW_HOOK_URL")
          [[ -n "${HOOK_TOKEN}" ]] || missing+=("OPENCLAW_HOOKS_TOKEN")
          [[ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]] || missing+=("GCP_WORKLOAD_IDENTITY_PROVIDER")
          [[ -n "${GCP_SERVICE_ACCOUNT}" ]] || missing+=("GCP_SERVICE_ACCOUNT")

          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi

      - name: Write event payload
        if: ${{ steps.hook-auth.outputs.enabled == 'true' }}
        run: |
          cat > event.json <<'JSON'
          ${{ toJson(github.event) }}
          JSON

      - name: Resolve hook audience
        if: ${{ steps.hook-auth.outputs.enabled == 'true' }}
        id: hook-audience
        env:
          HOOK_URL: ${{ secrets.OPENCLAW_HOOK_URL }}
          HOOK_AUDIENCE: ${{ secrets.OPENCLAW_HOOK_AUDIENCE }}
        run: |
          set -euo pipefail

          audience="${HOOK_AUDIENCE}"
          if [[ -z "${audience}" ]]; then
            audience="$(printf '%s' "${HOOK_URL}" | sed -E 's#^(https?://[^/]+).*$#\1#')"
          fi

          if [[ ! "${audience}" =~ ^https?://[^/]+$ ]]; then
            echo "Invalid hook audience derived from OPENCLAW_HOOK_URL: ${audience}"
            exit 1
          fi

          echo "value=${audience}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ steps.hook-auth.outputs.enabled == 'true' }}
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.hook-audience.outputs.value }}

      - name: Forward event to Sapphire gateway hook
        if: ${{ steps.hook-auth.outputs.enabled == 'true' }}
        env:
          HOOK_URL: ${{ secrets.OPENCLAW_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.OPENCLAW_HOOKS_TOKEN }}
          OIDC_TOKEN: ${{ steps.gcp-auth.outputs.id_token }}
          EVENT_NAME: ${{ github.event_name }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          OPENCLAW_HOOK_STRICT: ${{ vars.OPENCLAW_HOOK_STRICT }}
        run: |
          set -euo pipefail

          if [[ -z "${OIDC_TOKEN}" ]]; then
            echo "Missing OIDC token output from auth step."
            exit 1
          fi

          forward_once() {
            local target="$1"
            curl -sS -o response.json -w "%{http_code}" \
              -X POST "${target}" \
              -H "Content-Type: application/json" \
              -H "X-Serverless-Authorization: Bearer ${OIDC_TOKEN}" \
              -H "X-OpenClaw-Token: ${HOOK_TOKEN}" \
              -H "X-GitHub-Event: ${EVENT_NAME}" \
              -H "X-GitHub-Delivery: ${DELIVERY_ID}" \
              --data-binary @event.json
          }

          target_url="${HOOK_URL}"
          http_code="$(forward_once "${target_url}")"

          echo "Hook response HTTP: ${http_code} (${target_url})"
          if [[ "${http_code}" == "200" || "${http_code}" == "202" || "${http_code}" == "204" ]]; then
            echo "OpenClaw hook forward succeeded."
            exit 0
          fi

          # Backward-compatible retry: if a base URL was configured without route, try /hooks/agent.
          if [[ "${http_code}" == "404" && ! "${target_url}" =~ /hooks/agent/?$ ]]; then
            fallback_url="${target_url%/}/hooks/agent"
            echo "Retrying with fallback URL: ${fallback_url}"
            http_code="$(forward_once "${fallback_url}")"
            echo "Hook response HTTP: ${http_code} (${fallback_url})"
            if [[ "${http_code}" == "200" || "${http_code}" == "202" || "${http_code}" == "204" ]]; then
              echo "OpenClaw hook forward succeeded on fallback URL."
              exit 0
            fi
          fi

          echo "OpenClaw hook forward failed. Response:"
          cat response.json

          strict_mode="$(printf '%s' "${OPENCLAW_HOOK_STRICT:-false}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${strict_mode}" == "true" || "${strict_mode}" == "1" || "${strict_mode}" == "yes" ]]; then
            exit 1
          fi

          echo "Non-strict mode enabled; continuing despite hook forwarding failure."
          exit 0

      - name: Skip hook forward when secrets are unavailable
        if: ${{ steps.hook-auth.outputs.enabled != 'true' }}
        run: |
          echo "Skipping OpenClaw hook forward."
          echo "Missing required secrets: ${{ steps.hook-auth.outputs.missing }}"
