name: security

on:
  schedule:
    # Daily at 09:00 UTC (04:00 CT)
    - cron: "0 9 * * *"
  push:
    branches: [main]
    paths:
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # codeql-action/upload-sarif@v4 reads workflow-run metadata (telemetry +
  # the Get-a-workflow-run API) and fails hard without actions:read.
  # v3 tolerated the missing permission; v4 does not.
  actions: read

env:
  # Ari's self-hosted Sapphire runner runs as /Users/aribs, not /Users/runner.
  # Keep setup-python/tool installs in a writable local cache.
  AGENT_TOOLSDIRECTORY: /Users/aribs/.github-runners/toolcache
  RUNNER_TOOL_CACHE: /Users/aribs/.github-runners/toolcache

jobs:
  osv-scanner:
    name: osv-scanner (CVE lookup)
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: v1.9.1
        run: |
          if command -v osv-scanner >/dev/null 2>&1; then
            exit 0
          fi
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) asset="osv-scanner_darwin_arm64" ;;
            Darwin-x86_64) asset="osv-scanner_darwin_amd64" ;;
            Linux-x86_64) asset="osv-scanner_linux_amd64" ;;
            Linux-aarch64|Linux-arm64) asset="osv-scanner_linux_arm64" ;;
            *)
              echo "Unsupported runner platform for osv-scanner: $(uname -s)-$(uname -m)" >&2
              exit 1
              ;;
          esac
          install_dir="${RUNNER_TEMP}/osv-scanner"
          mkdir -p "$install_dir"
          wget -qO "${install_dir}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/${asset}"
          chmod +x "${install_dir}/osv-scanner"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan
        # Non-blocking: report findings, don't fail the workflow. The
        # security-events upload below is what makes them actionable.
        run: |
          osv-scanner --recursive --skip-git --format=sarif --output=osv.sarif ./ || true
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('osv.sarif') != '' }}
        # Soft-fail until Code Scanning is enabled in repo Settings →
        # Code security → Code scanning. Without that repo-level toggle,
        # SARIF upload errors with "Code scanning is not enabled for this
        # repository", which would mask actual scanner findings in the
        # daily cron. The SARIF file is still generated and retained as
        # a step artifact for manual inspection.
        continue-on-error: true
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  trivy-fs:
    name: trivy (filesystem)
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          timeout: "20m"
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        # Soft-fail until Code Scanning is enabled in repo Settings →
        # Code security → Code scanning. Without that repo-level toggle,
        # SARIF upload errors with "Code scanning is not enabled for this
        # repository", which would mask actual scanner findings in the
        # daily cron. The SARIF file is still generated and retained as
        # a step artifact for manual inspection.
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  bandit:
    name: bandit (python SAST)
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # -ll = high + medium severity only. Skip tests and archived/legacy.
      - run: uv run --python 3.11 --no-project --with "bandit[toml]" bandit -r services lib plugins --exclude "**/tests/**" -ll || true
