name: security

on:
  schedule:
    # Daily at 09:00 UTC (04:00 CT)
    - cron: "0 9 * * *"
  push:
    branches: [main]
    paths:
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # Ari's self-hosted Sapphire runner runs as /Users/aribs, not /Users/runner.
  # Keep setup-python/tool installs in a writable local cache.
  AGENT_TOOLSDIRECTORY: /Users/aribs/.github-runners/toolcache
  RUNNER_TOOL_CACHE: /Users/aribs/.github-runners/toolcache

jobs:
  # Ari's self-hosted Sapphire runner jobs share local runner state. Keep the
  # heavyweight scanners serialized so they do not cancel or clean each other's
  # workspaces/caches while producing SARIF.
  osv-scanner:
    name: osv-scanner (CVE lookup)
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: v1.9.1
        run: |
          if command -v osv-scanner >/dev/null 2>&1; then
            exit 0
          fi
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) asset="osv-scanner_darwin_arm64" ;;
            Darwin-x86_64) asset="osv-scanner_darwin_amd64" ;;
            Linux-x86_64) asset="osv-scanner_linux_amd64" ;;
            Linux-aarch64|Linux-arm64) asset="osv-scanner_linux_arm64" ;;
            *)
              echo "Unsupported runner platform for osv-scanner: $(uname -s)-$(uname -m)" >&2
              exit 1
              ;;
          esac
          install_dir="${RUNNER_TEMP}/osv-scanner"
          mkdir -p "$install_dir"
          wget -qO "${install_dir}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/${asset}"
          chmod +x "${install_dir}/osv-scanner"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan
        run: |
          osv-scanner --recursive --skip-git --format=sarif --output=osv.sarif ./ || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('osv.sarif') != '' }}
        with:
          name: osv-scanner-sarif
          path: osv.sarif
          if-no-files-found: ignore
          retention-days: 14

  trivy-fs:
    name: trivy (filesystem)
    needs: osv-scanner
    if: ${{ always() && vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          timeout: "20m"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          if-no-files-found: ignore
          retention-days: 14

  bandit:
    name: bandit (python SAST)
    needs: trivy-fs
    if: ${{ always() && vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: bandit — general scan (excludes analytics dashboard false positives)
        # -ll = high + medium severity only. Skip tests and archived/legacy.
        # This broad scan currently reports legacy findings without a checked-in
        # baseline, so keep it visible but non-blocking until the baseline lane
        # can separate existing debt from new findings.
        run: |
          uv run --python 3.11 --no-project --with "bandit[toml]" bandit \
            -r services lib plugins \
            --exclude "**/tests/**" \
            --exclude "services/analytics_dashboard/app.py" \
            -ll \
            --exit-zero
      - name: bandit — analytics dashboard (known false positives suppressed)
        # The analytics dashboard uses BigQuery parameterized queries where
        # table names are interpolated via f-strings using module-level
        # constants (PROJECT, DATASET). Bandit B608 flags these as SQL
        # injection, but user input is passed via BigQuery @param bindings.
        # B104 (0.0.0.0 bind) is required for Cloud Run containers.
        # B310 (urlopen) is used for internal health probes with fixed URLs.
        run: |
          uv run --python 3.11 --no-project --with "bandit[toml]" bandit \
            -r services/analytics_dashboard/app.py \
            -ll \
            -c .bandit.yml \
            --exit-zero
