name: security

on:
  schedule:
    # Daily at 09:00 UTC (04:00 CT)
    - cron: "0 9 * * *"
  push:
    branches: [main]
    paths:
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # codeql-action/upload-sarif@v4 reads workflow-run metadata (telemetry +
  # the Get-a-workflow-run API) and fails hard without actions:read.
  # v3 tolerated the missing permission; v4 does not.
  actions: read

jobs:
  osv-scanner:
    name: osv-scanner (CVE lookup)
    runs-on: ${{ vars.SAPPHIRE_RUNNER && fromJSON(vars.SAPPHIRE_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - name: Install osv-scanner
        run: |
          wget -qO /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v1.9.1/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
      - name: Scan
        # Non-blocking: report findings, don't fail the workflow. The
        # security-events upload below is what makes them actionable.
        run: |
          osv-scanner --recursive --skip-git --format=sarif --output=osv.sarif ./ || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        # Soft-fail until Code Scanning is enabled in repo Settings →
        # Code security → Code scanning. Without that repo-level toggle,
        # SARIF upload errors with "Code scanning is not enabled for this
        # repository", which would mask actual scanner findings in the
        # daily cron. The SARIF file is still generated and retained as
        # a step artifact for manual inspection.
        continue-on-error: true
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  trivy-fs:
    name: trivy (filesystem)
    runs-on: ${{ vars.SAPPHIRE_RUNNER && fromJSON(vars.SAPPHIRE_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        # Soft-fail until Code Scanning is enabled in repo Settings →
        # Code security → Code scanning. Without that repo-level toggle,
        # SARIF upload errors with "Code scanning is not enabled for this
        # repository", which would mask actual scanner findings in the
        # daily cron. The SARIF file is still generated and retained as
        # a step artifact for manual inspection.
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  bandit:
    name: bandit (python SAST)
    runs-on: ${{ vars.SAPPHIRE_RUNNER && fromJSON(vars.SAPPHIRE_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "bandit[toml]"
      # -ll = high + medium severity only. Skip tests and archived/legacy.
      - run: bandit -r services lib plugins --exclude "**/tests/**" -ll || true
