name: security

on:
  schedule:
    # Daily at 09:00 UTC (04:00 CT)
    - cron: "0 9 * * *"
  push:
    branches: [main]
    paths:
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  osv-scanner:
    name: osv-scanner (CVE lookup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install osv-scanner
        run: |
          wget -qO /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v1.9.1/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
      - name: Scan
        # Non-blocking: report findings, don't fail the workflow. The
        # security-events upload below is what makes them actionable.
        run: |
          osv-scanner --recursive --skip-git --format=sarif --output=osv.sarif ./ || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  trivy-fs:
    name: trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  bandit:
    name: bandit (python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "bandit[toml]"
      # -ll = high + medium severity only. Skip tests and archived/legacy.
      - run: bandit -r services lib plugins --exclude "**/tests/**" -ll || true
