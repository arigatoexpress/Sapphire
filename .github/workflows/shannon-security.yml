name: shannon-security

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorized target URL (staging/sandbox recommended)"
        required: true
        type: string
      repo_subpath:
        description: "Repository subpath to analyze (default '.')"
        required: false
        default: "."
        type: string
      workspace:
        description: "Optional Shannon workspace name"
        required: false
        default: ""
        type: string
      config_source:
        description: "Optional config path in repo (e.g. configs/security/shannon-app-config.example.yaml)"
        required: false
        default: ""
        type: string
      allow_production:
        description: "Allow denylisted production host"
        required: false
        default: false
        type: boolean
      authorization_ack:
        description: "Must be exactly I_HAVE_EXPLICIT_AUTHORIZATION"
        required: true
        type: string

jobs:
  shannon-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ack
        run: |
          if [ "${{ inputs.authorization_ack }}" != "I_HAVE_EXPLICIT_AUTHORIZATION" ]; then
            echo "authorization_ack must be I_HAVE_EXPLICIT_AUTHORIZATION"
            exit 1
          fi

      - name: Run Shannon scan
        env:
          AUTHORIZATION_ACK: ${{ inputs.authorization_ack }}
          TARGET_URL: ${{ inputs.target_url }}
          TARGET_REPO_PATH: ${{ github.workspace }}/${{ inputs.repo_subpath }}
          SHANNON_WORKSPACE: ${{ inputs.workspace }}
          SHANNON_CONFIG_SOURCE: ${{ inputs.config_source }}
          SHANNON_ALLOW_PRODUCTION: ${{ inputs.allow_production }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          chmod +x ./scripts/run_shannon_scan.sh
          ./scripts/run_shannon_scan.sh
