name: threat-refresh

on:
  schedule:
    # Shadow the local every-4h LaunchAgent during remote-routine migration.
    # Local remains canonical until shadow artifacts pass soak comparison.
    - cron: "10 1,5,9,13,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Ari's self-hosted Sapphire runner runs as /Users/aribs, not /Users/runner.
  # Keep setup-python's tool cache on a writable local path.
  AGENT_TOOLSDIRECTORY: /Users/aribs/.github-runners/toolcache
  RUNNER_TOOL_CACHE: /Users/aribs/.github-runners/toolcache

concurrency:
  group: threat-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh threats
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Refresh threats
        env:
          PYTHONPATH: ${{ github.workspace }}
          SAPPHIRE_THREATS_DATA_DIR: ${{ github.workspace }}/data/intelligence
          SAPPHIRE_THREATS_BOT_BIN: native
        run: |
          mkdir -p data/intelligence
          uv run --python 3.11 --no-project python services/dashboard/refresh_threats.py | tee threat-refresh.log
      - name: Upload threat artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: threat-refresh-${{ github.run_id }}
          path: |
            threat-refresh.log
            data/intelligence/**/threats.json
          if-no-files-found: error
          retention-days: 30
