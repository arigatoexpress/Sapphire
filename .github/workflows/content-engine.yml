name: content-engine

on:
  schedule:
    # Shadow the local 06:00 America/Denver content-engine LaunchAgent.
    # GitHub cron is UTC, so this is exact during MDT and one hour early during MST.
    # Local remains canonical until shadow artifacts pass soak comparison.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Ari's self-hosted Sapphire runner runs as /Users/aribs, not /Users/runner.
  # Keep setup-python's tool cache on a writable local path.
  AGENT_TOOLSDIRECTORY: /Users/aribs/.github-runners/toolcache
  RUNNER_TOOL_CACHE: /Users/aribs/.github-runners/toolcache

concurrency:
  group: content-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: generate content artifacts
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run content engine shadow
        env:
          PYTHONPATH: ${{ github.workspace }}
          SAPPHIRE_PUBLISH_LIVE: "0"
          SAPPHIRE_CONTENT_TELEGRAM_SUMMARY: "0"
        run: |
          mkdir -p data/content
          uv run --python 3.11 --no-project --with "yfinance>=0.2,<0.3" python -m lib.content | tee content-engine.log
      - name: Upload content artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: content-engine-${{ github.run_id }}
          path: |
            content-engine.log
            data/content/drafts/*.json
            data/content/ready/**/*
            data/market_pulse/*.md
          if-no-files-found: error
          retention-days: 30
