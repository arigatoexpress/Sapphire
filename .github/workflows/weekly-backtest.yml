name: weekly-backtest

on:
  schedule:
    # Shadow the local Saturday 22:00 LaunchAgent during the remote-routine migration.
    # 04:00 UTC Sunday maps to 22:00 MDT Saturday; the local LaunchAgent remains
    # canonical until shadow artifacts are compared through the soak window.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strategy-sweep:
    name: strategy sweep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt "yfinance>=0.2,<0.3"
      - name: Run strategy sweep
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p data/backtests/strategies
          python -m lib.analytics.run_strategies --days 90 --bankroll 10000 | tee backtest-weekly.log
      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-backtest-${{ github.run_id }}
          path: |
            backtest-weekly.log
            data/backtests/strategies/*.json
          if-no-files-found: error
          retention-days: 30
