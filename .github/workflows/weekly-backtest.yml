name: weekly-backtest

on:
  schedule:
    # Shadow the local Saturday 22:00 LaunchAgent during the remote-routine migration.
    # 04:00 UTC Sunday maps to 22:00 MDT Saturday; the local LaunchAgent remains
    # canonical until shadow artifacts are compared through the soak window.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Ari's self-hosted Sapphire runner runs as /Users/aribs, not /Users/runner.
  # Keep setup-python's tool cache on a writable local path.
  AGENT_TOOLSDIRECTORY: /Users/aribs/.github-runners/toolcache
  RUNNER_TOOL_CACHE: /Users/aribs/.github-runners/toolcache

concurrency:
  group: weekly-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strategy-sweep:
    name: strategy sweep
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Run strategy sweep
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p data/backtests/strategies
          uv run --python 3.11 --no-project --with-requirements requirements-test.txt --with "yfinance>=0.2,<0.3" python -m lib.analytics.run_strategies --days 90 --bankroll 10000 | tee backtest-weekly.log
      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-backtest-${{ github.run_id }}
          path: |
            backtest-weekly.log
            data/backtests/strategies/*.json
          if-no-files-found: error
          retention-days: 30
