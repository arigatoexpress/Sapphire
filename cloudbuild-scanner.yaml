steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '-f'
      - 'services/market-scanner/Dockerfile'
      - '.'
    id: 'build-scanner'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
    id: 'push-scanner'
    waitFor: ['build-scanner']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'market-scanner'
      - '--image'
      - '${_IMAGE}'
      - '--region'
      - 'us-central1'
      - '--project'
      - 'sapphire-479610'
      - '--no-traffic'
    id: 'deploy-scanner'
    waitFor: ['push-scanner']

images:
  - '${_IMAGE}'

substitutions:
  _IMAGE: 'gcr.io/sapphire-479610/sapphire-scanner:${SHORT_SHA}'

timeout: 1200s
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
