# Singapore Backend-Only Deployment (Backend + Frontend separate)
# Backend: Cloud Run in Singapore for trading
# Frontend: Firebase Hosting at sapphirealpha.xyz

steps:
  # Step 1: Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.backend'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sapphire-backend:${_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sapphire-backend:latest'
      - '.'
    id: 'build-backend'

  # Step 2: Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sapphire-backend:${_TAG}'
    id: 'push-backend'
    waitFor: ['build-backend']

  # Step 3: Deploy Backend to Singapore
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sapphire-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sapphire-backend:${_TAG}'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '8Gi'
      - '--cpu'
      - '4'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--cpu-boost'
      - '--execution-environment'
      - 'gen2'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,LOG_LEVEL=INFO,ENABLE_JUPITER=false,ENABLE_DRIFT=true,ENABLE_HYPERLIQUID=true,ENABLE_ASTER=true,ENABLE_LIGHTER=true,ENABLE_SYMPHONY=true,ENABLE_TELEGRAM_LISTENER=true,GEMINI_MODEL=gemini-2.0-flash-exp,GCP_PROJECT_ID=$PROJECT_ID,DEPLOYMENT_REGION=asia-southeast1,SOLANA_RPC_URL=https://api.mainnet-beta.solana.com'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # Step 4: Build Frontend
  - name: 'node:18'
    dir: 'sapphire-web'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        npm run build
    id: 'build-frontend'

  # Step 5: Deploy Frontend to Firebase with access control
  - name: 'gcr.io/$PROJECT_ID/firebase'
    args:
      - 'deploy'
      - '--only'
      - 'hosting'
      - '--project'
      - '$PROJECT_ID'
    dir: 'sapphire-web'
    id: 'deploy-frontend'
    waitFor: ['build-frontend']

images:
  - 'gcr.io/$PROJECT_ID/sapphire-backend:${_TAG}'
  - 'gcr.io/$PROJECT_ID/sapphire-backend:latest'

timeout: '3600s'

substitutions:
  _TAG: v2.3-singapore

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
