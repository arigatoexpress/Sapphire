steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '-f'
      - 'services/bot-lighter/Dockerfile'
      - '.'
    id: 'build-lighter'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
    id: 'push-lighter'
    waitFor: ['build-lighter']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bot-lighter'
      - '--image'
      - '${_IMAGE}'
      - '--region'
      - 'us-central1'
      - '--project'
      - 'sapphire-479610'
      - '--no-traffic'
    id: 'deploy-lighter'
    waitFor: ['push-lighter']

images:
  - '${_IMAGE}'

substitutions:
  _IMAGE: 'gcr.io/sapphire-479610/sapphire-lighter:${SHORT_SHA}'

timeout: 1200s
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
