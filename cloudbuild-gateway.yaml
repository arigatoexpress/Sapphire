steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '-f'
      - 'services/api-gateway/Dockerfile'
      - '.'
    id: 'build-gateway'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
    id: 'push-gateway'
    waitFor: ['build-gateway']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sapphire-gateway'
      - '--image'
      - '${_IMAGE}'
      - '--region'
      - 'us-central1'
      - '--project'
      - 'sapphire-479610'
      - '--service-account'
      - 'sapphirev3@sapphire-479610.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=sapphire-479610,SERVICE_NAME=sapphire-gateway,SYSTEM_LOGS_COLLECTION=system_logs,TRADING_METRICS_COLLECTION=trading_metrics,TRADE_EXECUTIONS_COLLECTION=trade_executions'
      - '--update-secrets'
      - 'SAPPHIRE_CONTROL_API_TOKEN=SAPPHIRE_CONTROL_API_TOKEN:latest,SAPPHIRE_TRADINGVIEW_WEBHOOK_SECRET=SAPPHIRE_TRADINGVIEW_WEBHOOK_SECRET:latest'
    id: 'deploy-gateway'
    waitFor: ['push-gateway']

images:
  - '${_IMAGE}'

substitutions:
  _IMAGE: 'gcr.io/sapphire-479610/sapphire-gateway:${SHORT_SHA}'

timeout: 1200s
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
