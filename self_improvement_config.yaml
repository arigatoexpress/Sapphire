# Sapphire OS - Self-Improvement Loop Configuration
# This configures the autonomous feedback loop for system optimization

self_improvement:
  enabled: true
  
  # Weekly review schedule
  schedule:
    review_day: "sunday"
    review_time: "02:00"  # 2 AM UTC
    timezone: "UTC"
  
  # Trading performance metrics that trigger improvements
  trading_metrics:
    primary: "pnl_cumulative"
    targets:
      win_rate: 0.80          # 80% target
      sortino_ratio: 2.0      # Risk-adjusted return
      calmar_ratio: 1.0       # Return / max drawdown
      max_drawdown: 0.10      # 10% max acceptable
    
    # If metrics below thresholds, create improvement tasks
    thresholds:
      win_rate_min: 0.65
      sortino_min: 1.0
      calmar_min: 0.5
      consecutive_losses: 3   # Alert after 3 losing trades
  
  # Agents that can implement improvements
  agents:
    strategy_optimizer:
      enabled: true
      capabilities:
        - "pine_script_optimization"
        - "parameter_tuning"
        - "backtesting"
      
    risk_manager:
      enabled: true
      capabilities:
        - "position_sizing_adjustment"
        - "stop_loss_optimization"
        - "correlation_analysis"
    
    code_improver:
      enabled: true
      capabilities:
        - "refactor_shared_code"
        - "optimize_docker_builds"
        - "update_dependencies"
  
  # Task creation rules
  rules:
    - name: "win_rate_drop"
      condition: "win_rate < 0.65"
      action: "create_task"
      priority: "high"
      assignee: "strategy_optimizer"
      description: "Win rate dropped below 65%. Review and optimize strategy parameters."
      
    - name: "drawdown_alert"
      condition: "max_drawdown > 0.10"
      action: "create_task"
      priority: "critical"
      assignee: "risk_manager"
      description: "Max drawdown exceeded 10%. Implement tighter risk controls."
      
    - name: "weekly_review"
      condition: "schedule == sunday_02:00"
      action: "create_review_task"
      priority: "medium"
      assignee: "code_improver"
      description: "Weekly system review - analyze metrics and propose improvements."
  
  # Pub/Sub topics for metrics
  pubsub:
    metrics_topic: "trading-metrics"
    alerts_topic: "risk-alerts"
    tasks_topic: "improvement-tasks"
  
  # Firestore collections
  firestore:
    metrics_collection: "trading_performance"
    tasks_collection: "improvement_tasks"
    reviews_collection: "weekly_reviews"
