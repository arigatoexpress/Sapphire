    consumers: [scheduled-tasks.sapphire-morning-briefing, hermes-agent.tho-operations]
    description: THO (housing) intelligence report generator.

  - name: lumo
    path: plugins/claw-sapphire/tools/internal/lumo.py
    status: internal
    owner: sapphire
    consumers: [hermes-agent.cyber-intel]
    description: Lumo-T5 cyber research workflow (chat mode).

  - name: lumo_research
    path: plugins/claw-sapphire/tools/internal/lumo_research.py
    status: internal
    owner: sapphire
    consumers: [hermes-agent.cyber-intel]
    description: Lumo-T5 structured research — briefs, CVE deep-dive, summaries.

  - name: solana_wallet
    path: plugins/claw-sapphire/tools/internal/solana_wallet.py
    status: internal
    owner: sapphire
    consumers: []
    description: Solana wallet helper — balance, SPL token lookups. (Thin wrapper over lib.trading.solana_wallet.)

  # AI complement — bounded Vertex/Gemini reasoning lane
  - name: gemini_ooda
    path: plugins/claw-sapphire/tools/internal/gemini_ooda.py
    status: internal
    owner: sapphire
    consumers: []
    description: Bounded Gemini OODA synthesizer. Dry-run by default; live mode requires SAPPHIRE_GEMINI_LIVE=1, runs through sensitivity gate, applies per-hour and per-month caps, caches results locally.

  - name: vertex_eval
    path: plugins/claw-sapphire/tools/internal/vertex_eval.py
    status: internal
    owner: sapphire
    consumers: []
    description: Vertex/Gemini eval harness. Benchmarks Gemini OODA outputs against the local 4-tier inference mesh and a deterministic mock baseline using a reproducible rubric (structural_validity, actionability, citation_density). Dry-run by default; live mode requires SAPPHIRE_GEMINI_LIVE=1 plus a key plus the sensitivity gate, and applies the same per-hour and per-month caps as gemini_ooda plus a per-run prompt cap.

  - name: narrative_synthesis
    path: plugins/claw-sapphire/tools/internal/narrative_synthesis.py
    status: internal
    owner: sapphire
    consumers: [services.synthesis]
    description: LLM Narrative Synthesis Engine 0.1.0. Turns signal_correlator edge_score outputs into provenance-stamped NarrativeThesis payloads with evidence bullets, counter-thesis, invalidators, next signal to watch, implied position, and deterministic rubric gating. Dry-run deterministic by default; live Gemini mode requires SAPPHIRE_NARRATIVE_LIVE=1 plus a key plus the sensitivity gate. Caps, ≤6144 output tokens, ≤18000 input chars, ≤6 live calls/hour, ≤750k tokens/month, publish rubric ≥0.70. Actions, synthesize-once/latest/history/rubric-score/status.

  - name: narrative_eval
    path: plugins/claw-sapphire/tools/internal/narrative_eval.py
    status: internal
    owner: sapphire
    consumers: [services.narrative_evaluation, services.dashboard]
    description: Narrative Engine Self-Evaluation Loop 0.1.0. Scores elapsed NarrativeThesis horizons against local actual outcomes, writes idempotent provenance-stamped score rows under data/narrative_evaluation, and reports rolling stats by symbol/timeframe/edge bucket/source mix/regime plus false-positive and calibration diagnostics. Pure, dry-run/mock-default, no live LLM calls, no Telegram sends, no trading critical path. Actions, score-thesis/aggregates/diagnostics/calibration/status.

  # Intel — BigQuery vector retrieval over the Sapphire intel corpus
  - name: intel_search
    path: plugins/claw-sapphire/tools/internal/intel_search.py
    status: internal
    owner: sapphire
    consumers: []
    description: Semantic retrieval over the Sapphire intel corpus (sovereign-thesis / convergence-watchlist / threat-intel). Mock-by-default in-memory cosine store with provenance-stamped hits; live BigQuery path is gated on SAPPHIRE_BQ_LIVE=1 + GOOGLE_APPLICATION_CREDENTIALS + SAPPHIRE_BQ_PROJECT match. Actions, search/index/stats/models. Caps, k≤50, batch≤5000, live≤2/hour.

  - name: telegram_intel
    path: plugins/claw-sapphire/tools/internal/telegram_intel.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.telegram-intel-reader, hermes-agent.intel]
    description: Telegram Channel Intel Reader 0.1.0. Gated MTProto/Bot API channel ingestion into provenance-stamped JSONL with pure quality filters, URL defanging, PII redaction, optional local balanced classifier, and caps of 32 channels, 600 messages/hour, 200 classifications/hour. Actions, status/pull-once/recent/quality-test/models.

  # Signals — cross-source correlation engine
  - name: signal_correlator
    path: plugins/claw-sapphire/tools/internal/signal_correlator.py
    status: internal
    owner: sapphire
    consumers: []
    description: Sapphire Signal Correlation Engine 0.1.0. Cross-source fusion across the 8 signal feeds (TradingView / Telegram intel / Hyperliquid public feed / threat-intel / convergence-watchlist / sovereign-thesis / Kronos forecast / TA scanner) into a unified edge_score, consensus label, and corroborated_by/divergent_sources arrays per (symbol, timeframe). Read-only consumer of disk snapshots, never writes back. Caps, ≤16 sources/correlation, ≤1200 correlations/hour, 24h freshness hard limit. Actions, correlate-once/latest/status/weights. Tunable via ~/.sapphire/correlator_weights.yaml.

  - name: event_impact
    path: plugins/claw-sapphire/tools/internal/event_impact.py
    status: internal
    owner: sapphire
    consumers: []
    description: Historical Event-Impact Modeling 0.1.0. Curated cited corpus plus empirical reaction-window lookup for macro, ETF, exchange-hack, enforcement, and broad macro-shock events across BTC/ETH/SOL/SPY/GLD. Dry-run by default; rebuild requires SAPPHIRE_EVENT_IMPACT_REBUILD=1 and writes provenance-stamped model artifacts. Actions, lookup/corpus/rebuild/accuracy-audit.

  - name: counterparty_intel
    path: plugins/claw-sapphire/tools/internal/counterparty_intel.py
    status: internal
    owner: sapphire
    consumers: []
    description: Hyperliquid Counter-Party Intelligence 0.1.0. Read-only public leaderboard and position-change tracker for top traders, dry-run by default and live-gated by SAPPHIRE_HYPERLIQUID_LIVE=1. Emits smart-money consensus signals without wallet keys or trade execution. Caps, ≤100 tracked traders, ≤12 refreshes/hour, min 30d PnL $50k, position-change threshold 15%. Actions, leaderboard/position-changes/smart-money-consensus/status.

  - name: cross_asset_intel
    path: plugins/claw-sapphire/tools/internal/cross_asset_intel.py
    status: internal
    owner: sapphire
    consumers: [services.cross-asset, services.dashboard]
    description: Cross-Asset Correlation Matrix + Regime Detection 0.1.0. Cache-first/dry-run-default rolling Pearson, Spearman, and Kendall matrices across crypto, equities, gold, dollar/forex, VIX, and Hyperliquid-derived assets; deterministic regime labels, breakdown events, and lead/lag analysis. Live source pulls require SAPPHIRE_CROSS_ASSET_LIVE=1. Caps, ≤24 assets, ≤365 days, ≥30 observations for long windows. Actions, matrix/regime/breakdowns/lead-lag/status.

  # On-chain intelligence 0.2.0
  - name: onchain_intel
    path: plugins/claw-sapphire/tools/internal/onchain_intel.py
    status: internal
    owner: sapphire
    consumers: [services.onchain_intel, scheduled-tasks.chain-refresh, hermes-agent.trading-analysis]
    description: On-chain intelligence 0.2.0 across Glassnode, Santiment, Ethereum RPC, and Solana RPC. Fixture by default; live calls require per-provider SAPPHIRE_*_LIVE gates plus key/RPC envs. Enforces local caps of 60/hour, 100k/day, and 730-day backfill. Read-only only; no wallet keys, no transactions, no trading.

  # ── deprecated / sunset window ───────────────────────────────────────────
  - name: kronos_predict
    path: plugins/claw-sapphire/tools/_deprecated/kronos_predict.py
    shim: plugins/claw-sapphire/tools/kronos_predict.py
    status: deprecated
    owner: sapphire
    replacement: predict_kronos
    remove_in: v0.5.0
    consumers: []
    description: Legacy Kronos forecaster — duplicate of predict_kronos. Use predict_kronos instead.
