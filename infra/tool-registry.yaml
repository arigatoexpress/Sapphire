# Sapphire Tool Registry
#
# Source of truth for every invocable tool in the repo. Validated by
# scripts/validate_tool_registry.py (run in CI).
#
# Status values:
#   registered  → agent-facing, listed in plugins/claw-sapphire/plugin.json
#   internal    → invoked programmatically (scheduled tasks, hermes skills,
#                 services); not exposed to the LLM tool manifest
#   deprecated  → in sunset window; a thin wrapper in tools/_deprecated/
#                 emits a DeprecationWarning on invocation
#   retired     → removed from disk (listed here as a historical record)
#
# agent-manifest.yaml must be a strict subset of entries with status=registered
# whose `agent_facing: true`. Keep the manifest lean — research shows LLM
# tool-selection accuracy drops from 74% to 49% as manifest size grows.

version: 1

tools:
  # ── registered / agent-facing ─────────────────────────────────────────────
  - name: sapphire_dispatch
    path: plugins/claw-sapphire/tools/dispatch.py
    status: registered
    agent_facing: true
    owner: sapphire
    consumers: [scheduled-tasks.factory-client-delivery, hermes-agent.kimi-delegate]
    description: Route a dev task to the cheapest capable inference tier (T0 Nemotron / T1 Kimi / T3 Claude). Classifies complexity, checks budget, executes.

  - name: sapphire_verify
    path: plugins/claw-sapphire/tools/verify.py
    status: registered
    agent_facing: true
    owner: sapphire
    consumers: [hermes-agent.system-ops, claude-code.manual]
    description: Run ruff + pytest on a repo. Returns pass/fail and safe-to-commit status. Use after code changes.

  - name: sapphire_budget
    path: plugins/claw-sapphire/tools/budget.py
    status: registered
    agent_facing: false
    owner: sapphire
    consumers: [scheduled-tasks.factory-repo-fixer, hermes-agent.inference-tier]
    description: Show token usage per tier (T0/T1/T3) with budget bars and call counts.

  - name: sapphire_state
    path: plugins/claw-sapphire/tools/state.py
    status: registered
    agent_facing: true
    owner: sapphire
    consumers: [scheduled-tasks.factory-repo-fixer]
    description: Read/write persistent factory state — known issues, fix attempts, backoff timers. Prevents re-attempting failed fixes.

  - name: sapphire_status
    path: plugins/claw-sapphire/tools/status.py
    status: registered
    agent_facing: false
    owner: sapphire
    consumers: [hermes-agent.system-health]
    description: Query Sapphire mesh status — Tailscale devices, Ollama models on GPU and local.

  - name: sapphire_notify
    path: plugins/claw-sapphire/tools/notify.py
    status: registered
    agent_facing: true
    owner: sapphire
    consumers:
      - scheduled-tasks.sapphire-morning-briefing
      - scheduled-tasks.sapphire-ci-monitor
      - scheduled-tasks.factory-test-guardian
      - scheduled-tasks.trading-research
      - hermes-agent.system-ops
    description: Send a Telegram notification via NemotronRariBot (p0 urgent / p1 normal / p2 low).

  - name: sapphire_market
    path: plugins/claw-sapphire/tools/market.py
    status: registered
    agent_facing: true
    owner: sapphire
    consumers: [hermes-agent.trading-analysis, hermes-agent.macro-data]
    description: "Unified market data — equity quotes, crypto OHLCV, FRED macro, news via OpenBB + TradingView live chart data + Pine CI. Actions: quote, crypto, historical, fred, news, snapshot, tv_quote, tv_ohlcv, tv_levels, tv_strategy, pine_ci."

  # ── internal / programmatically invoked ──────────────────────────────────
  - name: sapphire_pm_bot
    path: plugins/claw-sapphire/tools/sapphire_pm_bot.py
    status: internal
    owner: sapphire
    consumers: [services.pm-bot]
    description: Telegram command router for the Sapphire PM bot. Enforces allowlists, formats status, lists/creates PM tasks, and queries THO RAG.

  - name: dev_pulse
    path: plugins/claw-sapphire/tools/dev_pulse.py
    status: internal
    owner: sapphire
    consumers: [services.pm-bot, scheduled-tasks.morning-briefing, scheduled-tasks.morning-digest]
    description: Cross-repo developer pulse — aggregates open PRs, CI state, Cloud Run revisions, LaunchAgent health, trading signal state, and partner webhook delivery audit in one parallel fan-out. Formats MarkdownV2 for Telegram.

  - name: audit_panel
    path: plugins/claw-sapphire/tools/internal/audit_panel.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.audit-panel, hermes-agent.system-ops]
    description: Read-only multi-agent merge audit panel. Scores merged PRs for scope, safety-control, provenance, secret-signature, test-coverage, status-check, and no-spend merge anomalies.

  - name: morning_digest
    path: plugins/claw-sapphire/tools/morning_digest.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.morning-digest]
    description: Scheduled 8 AM Telegram digest built from dev_pulse, delivered through the shared Sapphire notify path at p3 informational priority.

  - name: service_supervisor
    path: plugins/claw-sapphire/tools/service_supervisor.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.service-supervisor, services.pm-bot]
    description: LaunchAgent self-healing supervisor — detects crashed services, restarts with rate limits, escalates to Telegram only if restart fails. Shares notification surface with watchdog.

  - name: _telegram_safety
    path: plugins/claw-sapphire/tools/internal/_telegram_safety.py
    status: internal
    owner: sapphire
    consumers: [services.pm-bot]
    description: Pure-function safety primitives for the Sapphire Telegram operator console — fail-closed allowlist loader, per-user sliding-window rate limiter, secret-keyword denylist regex, forbidden-command regex, live-trading tripwire assertion. No I/O at import; stdlib-only.

