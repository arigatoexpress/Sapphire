  - name: starred_repos
    path: plugins/claw-sapphire/tools/internal/starred_repos.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.github-discovery
      - scheduled-tasks.sapphire-morning-briefing
