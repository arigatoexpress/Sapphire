# Sapphire Tool Registry
#
# Source of truth for every invocable tool in the repo. Validated by
# scripts/validate_tool_registry.py (run in CI).
#
# Status values:
#   registered  → agent-facing, listed in plugins/claw-sapphire/plugin.json
#   internal    → invoked programmatically (scheduled tasks, hermes skills,
#                 services); not exposed to the LLM tool manifest
#   deprecated  → in sunset window; a thin wrapper in tools/_deprecated/
#                 emits a DeprecationWarning on invocation
#   retired     → removed from disk (listed here as a historical record)
#
# agent-manifest.yaml must be a strict subset of entries with status=registered
# whose `agent_facing: true`. Keep the manifest lean — research shows LLM
# tool-selection accuracy drops from 74% to 49% as manifest size grows.

version: 1

tools:
  # ── registered / agent-facing ─────────────────────────────────────────────
  - name: sapphire_dispatch
    path: plugins/claw-sapphire/tools/dispatch.py
    status: registered
    agent_facing: true
    owner: sapphire
    consumers: [scheduled-tasks.factory-client-delivery, hermes-agent.kimi-delegate]
    description: Route a dev task to the cheapest capable inference tier (T0 Nemotron / T1 Kimi / T3 Claude). Classifies complexity, checks budget, executes.

  - name: sapphire_verify
    path: plugins/claw-sapphire/tools/verify.py
    status: registered
    agent_facing: true
    owner: sapphire
    consumers: [hermes-agent.system-ops, claude-code.manual]
    description: Run ruff + pytest on a repo. Returns pass/fail and safe-to-commit status. Use after code changes.

  - name: sapphire_budget
    path: plugins/claw-sapphire/tools/budget.py
    status: registered
    agent_facing: false
    owner: sapphire
    consumers: [scheduled-tasks.factory-repo-fixer, hermes-agent.inference-tier]
    description: Show token usage per tier (T0/T1/T3) with budget bars and call counts.

  - name: sapphire_state
    path: plugins/claw-sapphire/tools/state.py
    status: registered
    agent_facing: true
    owner: sapphire
    consumers: [scheduled-tasks.factory-repo-fixer]
    description: Read/write persistent factory state — known issues, fix attempts, backoff timers. Prevents re-attempting failed fixes.

  - name: sapphire_status
    path: plugins/claw-sapphire/tools/status.py
    status: registered
    agent_facing: false
    owner: sapphire
    consumers: [hermes-agent.system-health]
    description: Query Sapphire mesh status — Tailscale devices, Ollama models on GPU and local.

  - name: sapphire_notify
    path: plugins/claw-sapphire/tools/notify.py
    status: registered
    agent_facing: true
    owner: sapphire
    consumers:
      - scheduled-tasks.sapphire-morning-briefing
      - scheduled-tasks.sapphire-ci-monitor
      - scheduled-tasks.factory-test-guardian
      - scheduled-tasks.trading-research
      - hermes-agent.system-ops
    description: Send a Telegram notification via NemotronRariBot (p0 urgent / p1 normal / p2 low).

  - name: sapphire_market
    path: plugins/claw-sapphire/tools/market.py
    status: registered
    agent_facing: true
    owner: sapphire
    consumers: [hermes-agent.trading-analysis, hermes-agent.macro-data]
    description: "Unified market data — equity quotes, crypto OHLCV, FRED macro, news via OpenBB + TradingView live chart data + Pine CI. Actions: quote, crypto, historical, fred, news, snapshot, tv_quote, tv_ohlcv, tv_levels, tv_strategy, pine_ci."

  # ── internal / programmatically invoked ──────────────────────────────────
  - name: sapphire_pm_bot
    path: plugins/claw-sapphire/tools/sapphire_pm_bot.py
    status: internal
    owner: sapphire
    consumers: [services.pm-bot]
    description: Telegram command router for the Sapphire PM bot. Enforces allowlists, formats status, lists/creates PM tasks, and queries THO RAG.

  - name: dev_pulse
    path: plugins/claw-sapphire/tools/dev_pulse.py
    status: internal
    owner: sapphire
    consumers: [services.pm-bot, scheduled-tasks.morning-briefing, scheduled-tasks.morning-digest]
    description: Cross-repo developer pulse — aggregates open PRs, CI state, Cloud Run revisions, LaunchAgent health, trading signal state, and partner webhook delivery audit in one parallel fan-out. Formats MarkdownV2 for Telegram.

  - name: morning_digest
    path: plugins/claw-sapphire/tools/morning_digest.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.morning-digest]
    description: Scheduled 8 AM Telegram digest built from dev_pulse, delivered through the shared Sapphire notify path at p3 informational priority.

  - name: service_supervisor
    path: plugins/claw-sapphire/tools/service_supervisor.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.service-supervisor, services.pm-bot]
    description: LaunchAgent self-healing supervisor — detects crashed services, restarts with rate limits, escalates to Telegram only if restart fails. Shares notification surface with watchdog.

  - name: _telegram_safety
    path: plugins/claw-sapphire/tools/internal/_telegram_safety.py
    status: internal
    owner: sapphire
    consumers: [services.pm-bot]
    description: Pure-function safety primitives for the Sapphire Telegram operator console — fail-closed allowlist loader, per-user sliding-window rate limiter, secret-keyword denylist regex, forbidden-command regex, live-trading tripwire assertion. No I/O at import; stdlib-only.

  # Trading & signals
  - name: predict
    path: plugins/claw-sapphire/tools/internal/predict.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.sapphire-morning-briefing
      - scheduled-tasks.trading-research
    description: 6-factor TA predictions (RSI, MACD, Bollinger, MA, ATR, volume). Scored nightly. 58% overall / 75% BTC win rate.

  - name: predict_kronos
    path: plugins/claw-sapphire/tools/internal/predict_kronos.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.trading-research]
    description: Kronos-base OHLCV forecasting. Preferred replacement for legacy kronos_predict.

  - name: signal_generator
    path: plugins/claw-sapphire/tools/internal/signal_generator.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.sapphire-morning-briefing
      - scheduled-tasks.market-pulse
    description: Autonomous RSI/MACD/BB/MA scanner → generates signals for paper trader.

  - name: paper_trader
    path: plugins/claw-sapphire/tools/internal/paper_trader.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.sapphire-morning-briefing
      - scheduled-tasks.market-pulse
      - hermes-agent.paper-trading
    description: $100K paper portfolio — ATR-based SL/TP (1.67:1 R:R), 10% sizing, round-trip friction.

  - name: crypto_portfolio
    path: plugins/claw-sapphire/tools/internal/crypto_portfolio.py
    status: internal
    owner: sapphire
    consumers: [hermes-agent.trading-analysis]
    description: Read-only crypto portfolio snapshot across exchanges.

  - name: backtest
    path: plugins/claw-sapphire/tools/internal/backtest.py
    status: internal
    owner: sapphire
    consumers: [hermes-agent.trading-analysis, scheduled-tasks.backtest-sweep]
    description: Strategy backtester — Sortino/Calmar/Sharpe, fee-aware.

  - name: trading_brain
    path: plugins/claw-sapphire/tools/internal/trading_brain.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.sapphire-morning-briefing
      - hermes-agent.trading-brain
    description: Multi-source decision engine — TA + ensemble + Kronos + macro consensus for BTC/ETH/SOL.

  - name: market_sentiment
    path: plugins/claw-sapphire/tools/internal/market_sentiment.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.sapphire-morning-briefing]
    description: Fear & Greed + social sentiment composite.

  - name: macro_data
    path: plugins/claw-sapphire/tools/internal/macro_data.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.sapphire-morning-briefing
      - hermes-agent.macro-data
    description: FRED macro dashboard (CPI, unemployment, rates, housing). Graceful fallback when FRED_API_KEY unset.

  # Intelligence & ops
  - name: threat_intel
    path: plugins/claw-sapphire/tools/internal/threat_intel.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.threat-intel-sweep
      - scheduled-tasks.sapphire-morning-briefing
      - hermes-agent.threat-intel
      - tests.integration.test_ecosystem
    description: CISA KEV / NVD / MITRE ATT&CK threat feed aggregation.

  - name: starred_repos
    path: plugins/claw-sapphire/tools/internal/starred_repos.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.github-discovery
      - scheduled-tasks.sapphire-morning-briefing
      - hermes-agent.repo-discovery
    description: GitHub starred-repo sync + trending project discovery.

  - name: vote_monitor
    path: plugins/claw-sapphire/tools/internal/vote_monitor.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.vote-monitor-collector]
    description: DeFi vote-escrow pool snapshots (Blackhole/Supernova/FullSail) + strategy recs.

  - name: health_check
    path: plugins/claw-sapphire/tools/internal/health_check.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.sapphire-self-improvement
      - hermes-agent.system-health
    description: Full-mesh health probe — services, Ollama tiers, disk, Redis.

  - name: watchdog
    path: plugins/claw-sapphire/tools/internal/watchdog.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.tho-production-healthcheck
      - scheduled-tasks.sapphire-morning-briefing
    description: Service state-transition watchdog → Telegram on up/down changes.

  - name: research
    path: plugins/claw-sapphire/tools/internal/research.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.trading-research
      - scheduled-tasks.sapphire-weekly-review
    description: Prediction scoring + per-symbol accuracy history.

  - name: digest
    path: plugins/claw-sapphire/tools/internal/digest.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.evening-digest]
    description: Daily digest composer — merges signals, trades, threats into a single report.

  - name: events
    path: plugins/claw-sapphire/tools/internal/events.py
    status: internal
    owner: sapphire
    consumers: [services.dashboard]
    description: Event-bus read helper — recent events by tag.

  - name: qa_aware_factory
    path: plugins/claw-sapphire/tools/internal/qa_aware_factory.py
    status: internal
    owner: sapphire
    consumers:
      - scheduled-tasks.factory-repo-fixer
      - scheduled-tasks.sapphire-weekly-review
    description: Factory self-awareness — what files it edits, what tests it runs, what metrics it tracks.

  # Outreach & specialized
  - name: lead_engine
    path: plugins/claw-sapphire/tools/internal/lead_engine.py
    status: internal
    owner: sapphire
    consumers: [scheduled-tasks.lead-generation]
    description: Autonomous outreach lead generation + prioritization.

  - name: lead_enrich
