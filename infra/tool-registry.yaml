  - name: lumo
    path: plugins/claw-sapphire/tools/internal/lumo.py
    status: internal
    owner: sapphire
    consumers: [hermes-agent.cyber-intel]
    description: Lumo-T5 cyber research workflow (chat mode).

  - name: lumo_research
    path: plugins/claw-sapphire/tools/internal/lumo_research.py
    status: internal
    owner: sapphire
    consumers: [hermes-agent.cyber-intel]
    description: Lumo-T5 structured research — briefs, CVE deep-dive, summaries.

  - name: solana_wallet
    path: plugins/claw-sapphire/tools/internal/solana_wallet.py
    status: internal
    owner: sapphire
    consumers: []
    description: Solana wallet helper — balance, SPL token lookups. (Thin wrapper over lib.trading.solana_wallet.)

  # AI complement — bounded Vertex/Gemini reasoning lane
  - name: gemini_ooda
    path: plugins/claw-sapphire/tools/internal/gemini_ooda.py
    status: internal
    owner: sapphire
    consumers: []
    description: Bounded Gemini OODA synthesizer. Dry-run by default; live mode requires SAPPHIRE_GEMINI_LIVE=1, runs through sensitivity gate, applies per-hour and per-month caps, caches results locally.

  # ── deprecated / sunset window ───────────────────────────────────────────
  - name: kronos_predict
    path: plugins/claw-sapphire/tools/_deprecated/kronos_predict.py
    shim: plugins/claw-sapphire/tools/kronos_predict.py
    status: deprecated
    owner: sapphire
    replacement: predict_kronos
    remove_in: v0.5.0
    consumers: []
    description: Legacy Kronos forecaster — duplicate of predict_kronos. Use predict_kronos instead.
