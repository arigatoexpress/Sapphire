# Cloudflare Tunnel — on-prem ingress for Sapphire OS
# Replaces GCP Cloud Run public endpoints entirely.
#
# Install on Windows PC (TradingView webhook host):
#   winget install Cloudflare.cloudflared
#   cloudflared tunnel login
#   cloudflared tunnel create sapphire-tunnel
#   cloudflared tunnel route dns sapphire-tunnel webhook.sapphirealpha.xyz
#   cloudflared tunnel route dns sapphire-tunnel dashboard.sapphirealpha.xyz
#
# Then run: cloudflared tunnel --config infra/cloudflare/tunnel-config.yml run
#
# Or install as Windows service:
#   cloudflared service install

tunnel: <YOUR_TUNNEL_ID>  # from: cloudflared tunnel list
credentials-file: C:\Users\<USERNAME>\.cloudflared\<TUNNEL_ID>.json

ingress:
  # TradingView webhook → Windows PC:9090 (primary path)
  - hostname: webhook.sapphirealpha.xyz
    service: http://localhost:9090

  # Dashboard → rari1:8080 (routed via Tailscale from Windows PC)
  # If tunnel runs on Mac instead, use http://100.x.x.x:8080
  - hostname: dashboard.sapphirealpha.xyz
    service: http://100.x.x.x:8080

  # Control plane PM hub → rari1:8082
  - hostname: pm.sapphirealpha.xyz
    service: http://100.x.x.x:8082

  # Catch-all
  - service: http_status:404
