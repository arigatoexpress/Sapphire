[profile.default]
src = "contracts"
out = "out/forge"
libs = ["contracts/lib"]
test = "tests/forge"
cache_path = "cache/forge"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
# Pretty-print gas snapshots for the Forge gas report artifact.
gas_reports = ["SapphireSentinelRegistry"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[profile.default.rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood_testnet = { key = "", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api" }
