# Arbitrum One protocol registry — source of truth for `lib.chains.arbitrum.registry`.
#
# All addresses cross-checked against the canonical Aave address book
# (https://github.com/aave-dao/aave-address-book/blob/main/src/AaveV3Arbitrum.sol)
# AND live-verified to have non-zero `eth_getCode` against
# https://arb1.arbitrum.io/rpc on 2026-04-30.
#
# Pool/Oracle/PoolDataProvider addresses were also cross-checked at runtime
# by querying the PoolAddressesProvider's getPool/getPriceOracle/getPoolDataProvider
# methods — they match the values pinned here.
#
# Schema:
#   <protocol_key>:
#     name: human display name
#     category: lending | dex_spot | dex_perps | stable | bridge | yield | oracle
#     priority: 1=must, 2=should, 3=nice
#     status: active | deprecated | pending
#     docs_url: external link
#     addresses: role -> 0x address
#     abi_paths: role -> path relative to `lib/chains/arbitrum/abis/`
#     notes: free-form string

aave_v3:
  name: "Aave V3 (Arbitrum One)"
  category: lending
  priority: 1
  status: active
  docs_url: "https://github.com/aave-dao/aave-address-book/blob/main/src/AaveV3Arbitrum.sol"
  addresses:
    pool: "0x794a61358D6845594F94dc1DB02A252b5b4814aD"
    pool_addresses_provider: "0xa97684ead0e402dC232d5A977953DF7ECBaB3CDb"
    oracle: "0xb56c2F0B653B2e0b10C9b928C8580Ac5Df02C7c7"
    ui_pool_data_provider: "0x145dE30c929a065582da84Cf96F88460dB9745A7"
    protocol_data_provider: "0x243aA95CaC2a25651Eda86E80BEe66114413c43B"
  abi_paths:
    pool: "aave_v3/pool_min.json"
    pool_addresses_provider: "aave_v3/pool_addresses_provider.json"
    oracle: "aave_v3/oracle.json"
    ui_pool_data_provider: "aave_v3/ui_pool_data_provider.json"
    protocol_data_provider: "aave_v3/protocol_data_provider.json"
  notes: >
    Aave V3 is THE flagship lending venue on Arbitrum One: ~20 active
    reserves on mainnet (verified via Pool.getReservesList() 2026-04-30,
    vs 8 on MegaETH), $1B+ in TVL versus the $392M MegaETH deployment.
    Same UiPoolDataProvider.getReservesData(provider) one-call pattern
    works because the Aave V3 protocol is identical across deployments;
    only the address bundle and underlying RPC change.
    Pool implementation address can be queried via the EIP-1967
    implementation slot on the Pool proxy if a verified ABI is needed
    beyond the curated pool_min.json.
