# Sapphire OS pre-commit hooks.
# Single source of truth: ruff handles format + lint + import sort.
# Mirrors what `.claude/settings.json` runs after every Edit/Write.

default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: ^(\.vscode/|\.claude/.*\.json$|tsconfig.*\.json$)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gitleaks-docs-plist
        name: gitleaks docs plist credential snippets
        entry: gitleaks detect --no-banner --no-git --redact=100 --config .gitleaks-docs.toml --source .
        language: system
        pass_filenames: false

      - id: pine-static-analyzer
        name: Pine v5 static analyzer (lib.pine)
        entry: python3 scripts/lint_pine.py
        language: system
        files: ^pine/.*\.pine$
        pass_filenames: true

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        # Gate changed Python files locally; run `pre-commit run bandit --all-files`
        # for an intentional full-repo security audit.
        args: ["-ll", "--skip", "B101,B601"]
        types: [python]
        exclude: ^(tests|legacy_code|archived|results|\.venv)/
