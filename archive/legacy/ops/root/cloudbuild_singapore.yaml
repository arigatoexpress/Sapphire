# ==============================================================================
# Cloud Build for Sapphire V2.3 - Singapore (Asia-Southeast1) Deployment
# ==============================================================================
# Optimized for ALL platforms with non-US routing
# Cost-effective: Only +10% vs US pricing, 50% cheaper than EU
# No proxy needed - direct deployment to Singapore
# ==============================================================================

steps:
  # Step 1: Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sapphire-trader:${_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sapphire-trader:latest'
      - '.'
    id: 'build'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sapphire-trader:${_TAG}'
    id: 'push-tag'
    waitFor: ['build']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sapphire-trader:latest'
    id: 'push-latest'
    waitFor: ['build']

  # Step 3: Deploy to Singapore (asia-southeast1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sapphire-trader:${_TAG}'
      - '--region'
      - 'asia-southeast1'  # Singapore for non-US routing
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '8Gi'
      - '--cpu'
      - '4'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'  # 5 minute timeout for startup
      - '--cpu-boost'  # Enable CPU boost for faster startup
      - '--execution-environment'
      - 'gen2'  # Use gen2 for better performance
      - '--set-env-vars'
      - 'ENVIRONMENT=production,LOG_LEVEL=INFO,ENABLE_JUPITER=false,ENABLE_ASTER=true,ENABLE_LIGHTER=true,ENABLE_ASTER=true,ENABLE_LIGHTER=true,ENABLE_ASTER=true,ENABLE_TELEGRAM_LISTENER=true,GEMINI_MODEL=gemini-2.0-flash-exp,GCP_PROJECT_ID=$PROJECT_ID,DEPLOYMENT_REGION=asia-southeast1,SOLANA_RPC_URL=https://api.mainnet-beta.solana.com'
    id: 'deploy'
    waitFor: ['push-tag']

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/sapphire-trader:${_TAG}'
  - 'gcr.io/$PROJECT_ID/sapphire-trader:latest'

# Build timeout
timeout: '3600s'

# Substitutions
substitutions:
  _TAG: v2.3-singapore
  _SERVICE_NAME: sapphire-v2

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Faster builds
