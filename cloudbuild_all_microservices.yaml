# Sapphire Microservices - Unified Deployment
# Builds one Docker image and deploys to multiple Cloud Run services
# Each service runs independently with only ONE platform enabled via env vars

steps:
  # ═══════════════════════════════════════════════════════════
  # STEP 1: Build Unified Docker Image
  # ═══════════════════════════════════════════════════════════
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sapphire-microservice:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sapphire-microservice:${_TAG}'
      - '-f'
      - 'Dockerfile.microservices'
      - '.'
    id: 'build-image'
    timeout: 1200s

  # ═══════════════════════════════════════════════════════════
  # STEP 2: Push to Container Registry
  # ═══════════════════════════════════════════════════════════
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sapphire-microservice:latest']
    id: 'push-latest'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sapphire-microservice:${_TAG}']
    id: 'push-sha'
    waitFor: ['build-image']

  # ═══════════════════════════════════════════════════════════
  # STEP 3: Deploy Jupiter Service (Solana DEX)
  # ═══════════════════════════════════════════════════════════
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sapphire-jupiter'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sapphire-microservice:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '5'
      - '--min-instances'
      - '1'
      - '--vpc-connector'
      - 'sapphire-connector'
      - '--vpc-egress'
      - 'all-traffic'
      - '--set-env-vars'
      - 'ENABLE_JUPITER=true,ENABLE_DRIFT=false,ENABLE_ASTER=false,ENABLE_HYPERLIQUID=false,ENABLE_LIGHTER=false,ENABLE_SYMPHONY=false,ENABLE_PUBSUB=true,GCP_PROJECT_ID=$PROJECT_ID,ENVIRONMENT=production,LOG_LEVEL=INFO,SOLANA_RPC_URL=https://api.mainnet-beta.solana.com'
      - '--set-secrets'
      - 'JUPITER_API_KEY=JUPITER_API_KEY:latest,SOLANA_PRIVATE_KEY=SOLANA_PRIVATE_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest'
    id: 'deploy-jupiter'
    waitFor: ['push-latest']

  # ═══════════════════════════════════════════════════════════
  # STEP 4: Deploy Drift Service (Solana Perps)
  # ═══════════════════════════════════════════════════════════
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sapphire-drift'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sapphire-microservice:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '5'
      - '--min-instances'
      - '1'
      - '--vpc-connector'
      - 'sapphire-connector'
      - '--vpc-egress'
      - 'all-traffic'
      - '--set-env-vars'
      - 'ENABLE_JUPITER=false,ENABLE_DRIFT=true,ENABLE_ASTER=false,ENABLE_HYPERLIQUID=false,ENABLE_LIGHTER=false,ENABLE_SYMPHONY=false,ENABLE_PUBSUB=true,GCP_PROJECT_ID=$PROJECT_ID,ENVIRONMENT=production,LOG_LEVEL=INFO,SOLANA_RPC_URL=https://api.mainnet-beta.solana.com'
      - '--set-secrets'
      - 'SOLANA_PRIVATE_KEY=DRIFT_SOLANA_PRIVATE_KEY:latest,DRIFT_PRIVATE_KEY=DRIFT_SOLANA_PRIVATE_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest'
    id: 'deploy-drift'
    waitFor: ['push-latest']

  # ═══════════════════════════════════════════════════════════
  # STEP 5: Deploy Aster Service (CEX)
  # ═══════════════════════════════════════════════════════════
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sapphire-aster'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sapphire-microservice:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '5'
      - '--min-instances'
      - '1'
      - '--vpc-connector'
      - 'sapphire-connector'
      - '--vpc-egress'
      - 'all-traffic'
      - '--set-env-vars'
      - 'ENABLE_JUPITER=false,ENABLE_DRIFT=false,ENABLE_ASTER=true,ENABLE_HYPERLIQUID=false,ENABLE_LIGHTER=false,ENABLE_SYMPHONY=false,ENABLE_PUBSUB=true,GCP_PROJECT_ID=$PROJECT_ID,ENVIRONMENT=production,LOG_LEVEL=INFO'
      - '--set-secrets'
      - 'ASTER_API_KEY=ASTER_API_KEY:latest,ASTER_SECRET_KEY=ASTER_SECRET_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest'
    id: 'deploy-aster'
    waitFor: ['push-latest']

  # ═══════════════════════════════════════════════════════════
  # STEP 6: Deploy Hyperliquid Service (L1 Perps)
  # ═══════════════════════════════════════════════════════════
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sapphire-hyperliquid'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sapphire-microservice:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '5'
      - '--min-instances'
      - '1'
      - '--vpc-connector'
      - 'sapphire-connector'
      - '--vpc-egress'
      - 'all-traffic'
      - '--set-env-vars'
      - 'ENABLE_JUPITER=false,ENABLE_DRIFT=false,ENABLE_ASTER=false,ENABLE_HYPERLIQUID=true,ENABLE_LIGHTER=false,ENABLE_SYMPHONY=false,ENABLE_PUBSUB=true,GCP_PROJECT_ID=$PROJECT_ID,ENVIRONMENT=production,LOG_LEVEL=INFO'
      - '--set-secrets'
      - 'HL_SECRET_KEY=HL_SECRET_KEY:latest,HL_ACCOUNT_ADDRESS=HL_ACCOUNT_ADDRESS:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest'
    id: 'deploy-hyperliquid'
    waitFor: ['push-latest']

  # ═══════════════════════════════════════════════════════════
  # STEP 7: Deploy Symphony Service (Monad/Base)
  # ═══════════════════════════════════════════════════════════
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sapphire-symphony'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sapphire-microservice:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '5'
      - '--min-instances'
      - '1'
      - '--vpc-connector'
      - 'sapphire-connector'
      - '--vpc-egress'
      - 'all-traffic'
      - '--set-env-vars'
      - 'ENABLE_JUPITER=false,ENABLE_DRIFT=false,ENABLE_ASTER=false,ENABLE_HYPERLIQUID=false,ENABLE_LIGHTER=false,ENABLE_SYMPHONY=true,ENABLE_PUBSUB=true,GCP_PROJECT_ID=$PROJECT_ID,ENVIRONMENT=production,LOG_LEVEL=INFO'
      - '--set-secrets'
      - 'SYMPHONY_API_KEY=SYMPHONY_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest'
    id: 'deploy-symphony'
    waitFor: ['push-latest']

  # ═══════════════════════════════════════════════════════════
  # STEP 8: Deploy Lighter Service (Ethereum L2)
  # ZK-rollup based L2 order book exchange
  # ═══════════════════════════════════════════════════════════
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sapphire-lighter'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sapphire-microservice:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '5'
      - '--min-instances'
      - '1'
      - '--vpc-connector'
      - 'sapphire-connector'
      - '--vpc-egress'
      - 'all-traffic'
      - '--set-env-vars'
      - 'ENABLE_JUPITER=false,ENABLE_DRIFT=false,ENABLE_ASTER=false,ENABLE_HYPERLIQUID=false,ENABLE_LIGHTER=true,ENABLE_SYMPHONY=false,ENABLE_PUBSUB=true,GCP_PROJECT_ID=$PROJECT_ID,ENVIRONMENT=production,LOG_LEVEL=INFO'
      - '--set-secrets'
      - 'LIGHTER_PUB_KEY=LIGHTER_PUB_KEY:latest,LIGHTER_PRIV_KEY=LIGHTER_PRIV_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest'
    id: 'deploy-lighter'
    waitFor: ['push-latest']

# Images to store in GCR
images:
  - 'gcr.io/$PROJECT_ID/sapphire-microservice:latest'
  - 'gcr.io/$PROJECT_ID/sapphire-microservice:${_TAG}'

# Build timeout
timeout: 3600s

# Options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Substitutions
substitutions:
  _TAG: 'latest'
