<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" width="256" height="64" role="img" aria-label="Sapphire OS">
  <title>Sapphire OS</title>
  <desc>Sapphire OS wordmark with monogram for dark backgrounds.</desc>
  <g transform="translate(8 8)">
    <g transform="translate(24 24)">
      <path d="M0,-20 L20,0 L0,20 L-20,0 Z" fill="none" stroke="#e6ecff" stroke-width="2.25" stroke-linejoin="miter"/>
      <path d="M0,-20 L0,20 M-20,0 L20,0" fill="none" stroke="#8edcff" stroke-width="1.25" opacity="0.55"/>
      <path d="M-20,0 L0,-8 L20,0 L0,8 Z" fill="#6da5ff" opacity="0.22"/>
